<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Generator 150</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1a1a2e;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 0 40px rgba(114, 137, 218, 0.3);
            text-align: center;
        }
        h1 { color: #7289da; font-size: 28px; margin-bottom: 5px; }
        .sub { color: #99aab5; margin-bottom: 25px; font-size: 14px; }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .stat-box {
            background: #2c2f3e;
            padding: 15px 10px;
            border-radius: 10px;
        }
        .stat-box .num { font-size: 28px; font-weight: bold; color: #7289da; }
        .stat-box .label { font-size: 12px; color: #99aab5; margin-top: 5px; }
        button {
            width: 100%;
            padding: 16px;
            background: #7289da;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin: 8px 0;
        }
        button:hover { background: #5b6eae; transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .github-btn {
            background: #24292e;
        }
        .github-btn:hover { background: #1a1d21; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: #2c2f3e;
            border-radius: 10px;
            display: none;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            text-align: left;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        #status.show { display: block; }
        .link {
            color: #7289da;
            text-decoration: none;
            font-size: 14px;
        }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Roblox Generator</h1>
        <p class="sub">150 аккаунтов • 3 типа устройств</p>
        
        <div class="stats">
            <div class="stat-box">
                <div class="num">50</div>
                <div class="label">📱 Планшеты</div>
            </div>
            <div class="stat-box">
                <div class="num">50</div>
                <div class="label">📱 Телефоны</div>
            </div>
            <div class="stat-box">
                <div class="num">50</div>
                <div class="label">💻 Компьютеры</div>
            </div>
        </div>
        
        <button id="runBtn" onclick="runGenerator()">🚀 Запустить генерацию 150</button>
        <button class="github-btn" onclick="window.open('https://github.com/ваш-аккаунт/ваш-репозиторий/actions', '_blank')">
            📊 Смотреть прогресс
        </button>
        
        <a class="link" href="#" onclick="document.getElementById('status').className='status show'; document.getElementById('status').textContent='📥 Скачайте файлы во вкладке Actions после завершения.'">📥 Как скачать аккаунты?</a>
        
        <div id="status"></div>
    </div>

    <script>
        async function runGenerator() {
            const btn = document.getElementById('runBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = '⏳ Запуск...';
            status.className = 'status show';
            status.textContent = '🔄 Отправка запроса на GitHub...\n\nОжидайте 5-10 минут.\nБудет создано 150 аккаунтов:\n- 50 планшетов\n- 50 телефонов\n- 50 компьютеров';
            
            try {
                const response = await fetch(
                    'https://api.github.com/repos/ваш-аккаунт/ваш-репозиторий/actions/workflows/generate.yml/dispatches',
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            ref: 'main',
                            inputs: {
                                total: '150'
                            }
                        })
                    }
                );
                
                if (response.ok) {
                    status.textContent = '✅ Генерация ЗАПУЩЕНА!\n\n' +
                        '📊 GitHub создаёт 150 виртуальных машин\n' +
                        '🔄 Аккаунты распределены по 3 типам\n' +
                        '📱 50 планшетов, 50 телефонов, 50 ПК\n\n' +
                        '⏱️ Через 5-10 минут скачайте файлы:\n' +
                        '1️⃣ Перейдите во вкладку "Actions"\n' +
                        '2️⃣ Нажмите на последний запуск\n' +
                        '3️⃣ Внизу скачайте все account_*.txt\n' +
                        '4️⃣ Объедините их в один файл';
                } else {
                    status.textContent = `❌ Ошибка: ${response.status}\n\nПроверьте:\n- Название репозитория\n- Наличие GITHUB_TOKEN\n- Права на запуск Actions`;
                }
            } catch (error) {
                status.textContent = `❌ Ошибка: ${error.message}\n\nВозможно, проблема с интернетом или CORS.`;
            }
            
            btn.disabled = false;
            btn.textContent = '🚀 Запустить генерацию 150';
        }
    </script>
</body>
</html>
