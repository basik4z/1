<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wave AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#000;color:#fff}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:16px}
header{padding:10px 0;text-align:center;font-size:12px;letter-spacing:8px;color:rgba(255,255,255,0.4)}
#faceWrap{flex:1;display:flex;align-items:center;justify-content:center}
#face{width:60vw;max-width:220px;height:60vw;max-height:220px}
#dialog{text-align:center;font-size:17px;min-height:60px;margin-bottom:10px;padding:0 10px}
#status{text-align:center;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,0.4);margin-bottom:12px}
#talkBtn{width:90px;height:90px;border-radius:50%;background:#000;border:1.5px solid #fff;color:#fff;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px}
#talkBtn.active{background:#fff;color:#000}
#chatRow{display:flex;gap:8px;padding-bottom:10px}
#chatField{flex:1;padding:12px;border-radius:22px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:15px;outline:none}
#chatSend{padding:0 20px;border-radius:22px;background:#fff;color:#000;border:none;font-weight:700;font-size:16px;cursor:pointer}
#startScreen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;z-index:100}
#startScreen.hide{display:none}
#startBtn{padding:18px 60px;border-radius:40px;background:#fff;color:#000;border:none;font-size:16px;font-weight:700;letter-spacing:3px;cursor:pointer}
h1{font-size:42px;font-weight:200;letter-spacing:-1px}
</style>
</head>
<body>

<div id="startScreen">
  <h1>Wave AI</h1>
  <button id="startBtn">НАЧАТЬ</button>
</div>

<div id="app">
  <header>WAVE · AI</header>
  <div id="faceWrap">
    <svg id="face" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="78" fill="#000" stroke="#fff" stroke-width="3"/>
      <ellipse cx="74" cy="86" rx="10" ry="13" fill="#fff"/>
      <ellipse cx="126" cy="86" rx="10" ry="13" fill="#fff"/>
      <circle cx="74" cy="86" r="5" fill="#000"/>
      <circle cx="126" cy="86" r="5" fill="#000"/>
      <path id="mouth" d="M 78 128 Q 100 138 122 128" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="dialog">Нажми микрофон и говори</div>
  <div id="status">готов</div>
  <button id="talkBtn">🎤</button>
  <div id="chatRow">
    <input id="chatField" type="text" placeholder="Или напиши…" autocomplete="off">
    <button id="chatSend">→</button>
  </div>
</div>

<script>
var dialogEl = document.getElementById('dialog');
var statusEl = document.getElementById('status');
var talk разBtn = document.getElementById('talkBtn');
говаvar chatField = documentри.getElementById('chatField');
var chatSend = document.getElementById('chatSend');
var startScreen = document.getElementById('startScreen');
var startBtn = document.getElementById('startBtn');
var mouth = document.getElementById('mouth');

var lastText = '';

/* ===== СТАРТ ===== */
startBtn.onclick = function() {
  startвать.');
 Screen.classList.add('hide');
  setTimeout(function(){
    speak('Привет! Я Wave AI. Буду с тобой сегодня }, 300);
};

/* ===== ГОЛОС ===== */
function speak(text) {
  lastText = text;
  dialogEl.textContent = text;
  statusEl.textContent = 'говорит';

  // Анимация рта
  var open = false;
  var anim = setInterval(function(){
    open = !open;
    mouth.setAttribute('d', open
      ? 'M 78 128 Q 100 148 122 128'
      : 'M 78 128 Q 100 138 122 128');
  }, 150);

  try { speechSynthesis.cancel(); } catch(e) {}

  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1.0;
  u.pitch = 1.05;
  var voices = speechSynthesis.getVoices();
  var ru = voices.find(function(v){return v.lang === 'ru-RU'})
        || voices.find(function(v){return v.lang && v.lang.indexOf('ru') === 0});
  if (ru) u.voice = ru;

  u.onend = function() {
    clearInterval(anim);
    mouth.setAttribute('d', 'M 78 128 Q 100 138 122 128');
    statusEl.textContent = 'готов';
  };
  u.onerror = u.onend;
  speechSynthesis.speak(u);
}

/* ===== ОТВЕТЫ ===== */
function answer(text) {
  var t = text.toLowerCase();

  // Калькулятор
  var s = ' ' + t + ' ';
  s = s.replace(/\bплюс\b/g, '+').replace(/\bминус\b/g, '-')
       .replace(/\bумножить на\b/g, '*').replace(/\bразделить на\b/g, '/')
       .replace(/\bумножить\b/g, '*').replace(/\bразделить\b/g, '/');
  s = s.replace(/[^0-9+\-*\/.\s]/g, ' ').trim();
  if (/[0-9]/.test(s) && /[+\-*\/]/.test(s)) {
    try {
      var r = Function('"use strict";return (' + s + ')')();
      if (typeof r === 'number' && isFinite(r)) {
        speak('Получается ' + (Math.round(r*10000)/10000) + '.');
        return;
      }
    } catch(e) {}
  }

  if (t.indexOf('который час') >= 0 || t.indexOf('сколько времени') >= 0) {
    var d = new Date();
    speak('Сейчас ' + d.getHours() + ' часов ' + d.getMinutes() + ' минут.');
    return;
  }
  if (t.indexOf('монетк') >= 0) {
    speak(Math.random() < 0.5 ? 'Выпал орёл.' : 'Выпала решка.');
    return;
  }
  if (t.indexOf('кубик') >= 0) {
    speak('Выпало ' + (Math.floor(Math.random()*6)+1) + '.');
    return;
  }
  if (t.indexOf('шутк') >= 0 || t.indexOf('анекдот') >= 0) {
    var jokes = [
      'Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 равно DEC 25.',
      'Заходит нейросеть в бар, а бармен: вам как обычно? Нейросеть: я тут впервые.',
      'Что сказал один бит другому? Ты мне нравишься, но у нас разные байты.'
    ];
    speak(jokes[Math.floor(Math.random()*jokes.length)]);
    return;
  }
  if (t.indexOf('факт') >= 0) {
    var facts = [
      'Осьминог имеет три сердца и голубую кровь.',
      'Бананы — это ягоды, а малина — нет.',
      'Свет от Солнца доходит до Земли за 8 минут 20 секунд.'
    ];
    speak(facts[Math.floor(Math.random()*facts.length)]);
    return;
  }
  if (t.indexOf('привет') >= 0) { speak('Привет! Как ты?'); return; }
  if (t.indexOf('как дела') >= 0) { speak('Отлично! А у тебя как?'); return; }
  if (t.indexOf('кто ты') >= 0) { speak('Я Wave AI, твой голосовой ассистент.'); return; }
  if (t.indexOf('пока') >= 0) { speak('Пока! Возвращайся.'); return; }

  // ИИ-запрос
  statusEl.textContent = 'думает';
  fetch('https://text.pollinations.ai/' + encodeURIComponent(text))
    .then(function(r){ return r.text(); })
    .then(function(reply){
      reply = reply.replace(/[*_`#]/g,'').replace(/\n+/g,' ').trim();
      if (reply.length > 250) reply = reply.substring(0, 250) + '...';
      speak(reply);
    })
    .catch(function(){ speak('Не могу ответить, попробуй ещё раз.'); });
}

/* ===== МИКРОФОН ===== */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null;
var listening = false;

if (SR) {
  rec = new SR();
  rec.lang = 'ru-RU';
  rec.interimResults = false;
  rec.continuous = false;

  rec.onstart = function() {
    listening = true;
    talkBtn.classList.add('active');
    statusEl.textContent = 'слушаю';
    dialogEl.textContent = '…';
  };
  rec.onresult = function(e) {
    var t = e.results[0][0].transcript;
    dialogEl.textContent = 'Ты: ' + t;
    answer(t);
  };
  rec.onerror = function(e) {
    statusEl.textContent = 'ошибка: ' + e.error;
    talkBtn.classList.remove('active');
    listening = false;
  };
  rec.onend = function() {
    talkBtn.classList.remove('active');
    listening = false;
    if (statusEl.textContent === 'слушаю') statusEl.textContent = 'готов';
  };
}

talkBtn.onclick = function() {
  if (!SR) { speak('Браузер не поддерживает микрофон.'); return; }
  if (listening) { rec.stop(); return; }
  try { speechSynthesis.cancel(); } catch(e) {}
  try { rec.start(); } catch(e) { statusEl.textContent = 'ошибка: ' + e.message; }
};

/* ===== ТЕКСТ ===== */
chatSend.onclick = function() {
  var t = chatField.value.trim();
  if (!t) return;
  chatField.value = '';
  dialogEl.textContent = 'Ты: ' + t;
  answer(t);
};
chatField.onkeydown = function(e) {
  if (e.key === 'Enter') chatSend.click();
};
</script>
</body>
</html>
