<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wave AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Wave AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    background: #000; color: #fff;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    position: relative;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    padding: 16px 0 8px;
    text-align: center;
    flex-shrink: 0;
    display: flex; justify-content: center; align-items: center; gap: 14px;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
  }

  #faceWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  #face {
    width: min(60vw, 240px);
    height: min(60vw, 240px);
    position: relative;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #face svg { width: 100%; height: 100%; overflow: visible; }
  #face.listening { transform: scale(0.92); }

  #ear {
    opacity: 0;
    transform-origin: 150px 100px;
    transition: opacity 0.35s ease;
  }
  #face.listening #ear {
    opacity: 1;
    animation: earPulse 1s infinite ease-in-out;
  }
  @keyframes earPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  #hand {
    opacity: 0;
    transform-origin: 190px 150px;
    transition: opacity 0.3s;
  }
  #face.waving #hand {
    opacity: 1;
    animation: waveHand 0.5s infinite ease-in-out;
  }
  @keyframes waveHand {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(22deg); }
  }

  #mouth {
    transition: all 0.15s ease;
    transform-origin: 100px 130px;
  }
  #face.talking #mouth {
    animation: talkAnim 0.18s infinite alternate ease-in-out;
  }
  @keyframes talkAnim {
    from { transform: scaleY(1); }
    to { transform: scaleY(2.8); }
  }

  #eyeL, #eyeR {
    transform-origin: center;
    transition: transform 0.1s;
  }
  #face.blink #eyeL,
  #face.blink #eyeR {
    transform: scaleY(0.08);
  }
  #pupilL, #pupilR {
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #face.listening #pupilL { transform: translate(3px, 0); }
  #face.listening #pupilR { transform: translate(3px, 0); }
  #face.talking #eyeL,
  #face.talking #eyeR { transform: scaleY(0.75); }

  #browL, #browR { transition: opacity 0.3s; }
  #face.listening #browL,
  #face.listening #browR { opacity: 1; }

  #dialog {
    text-align: center;
    font-size: 18px;
    font-weight: 300;
    line-height: 1.4;
    color: #fff;
    max-width: 92%;
    margin: 0 auto 8px;
    min-height: 50px;
    padding: 0 8px;
    overflow-y: auto;
    max-height: 25vh;
  }
  #dialog .you {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    display: block;
    margin-bottom: 3px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }
  #dialog .wave {
    color: #a5b4fc;
    font-size: 11px;
    display: block;
    margin-bottom: 3px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }

  #status {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
    text-align: center;
    margin-bottom: 12px;
    min-height: 14px;
    flex-shrink: 0;
  }
  #status.listening { color: #fff; }
  #status.speaking { color: #a5b4fc; }
  #status.thinking { color: #fbbf24; }

  #controls {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  #talkBtn {
    position: relative;
    width: 88px; height: 88px;
    border-radius: 50%;
    background: #000;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }
  #talkBtn:active { transform: scale(0.94); }
  #talkBtn.active {
    background: #fff;
    border-color: #fff;
    box-shadow: 0 0 80px rgba(255,255,255,0.5);
  }
  #talkBtn.active svg { stroke: #000; }
  #talkBtn.listening::before,
  #talkBtn.listening::after {
    content: '';
    position: absolute;
    width: 88px; height: 88px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    animation: ring 1.6s infinite ease-out;
  }
  #talkBtn.listening::after { animation-delay: 0.8s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  #talkBtn svg {
    width: 34px; height: 34px;
    stroke: #fff; stroke-width: 1.6;
    fill: none;
  }

  #chatInput {
    display: flex;
    padding: 0 8px 12px;
    gap: 8px;
    flex-shrink: 0;
  }
  #chatInput input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  #chatInput input::placeholder { color: rgba(255,255,255,0.35); }
  #chatInput input:focus { border-color: rgba(255,255,255,0.5); }
  #chatInput button {
    padding: 0 18px;
    border-radius: 24px;
    background: #fff;
    color: #000;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding: 40px 24px;
    transition: opacity 0.8s ease;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }

  #startName {
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -1px;
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  #startName span {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: letterIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0); } }

  #startSub {
    font-size: 11px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: "SF Mono", ui-monospace, monospace;
    opacity: 0;
    animation: fadeIn 1s ease 1s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  #startBtn {
    padding: 16px 48px;
    border-radius: 40px;
    background: #000;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
  }
  #startBtn:active { transform: scale(0.95); background: #fff; color: #000; }

  @media (max-width: 400px) {
    #dialog { font-size: 15px; }
    #talkBtn { width: 76px; height: 76px; }
    #talkBtn svg { width: 28px; height: 28px; }
    #startName { font-size: 38px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">Wave · AI</div>
  </header>

  <div id="faceWrap">
    <div id="face">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="78" fill="#000" stroke="#fff" stroke-width="3"/>
        <g id="eyeL">
          <ellipse cx="74" cy="86" rx="10" ry="13" fill="#fff"/>
          <circle id="pupilL" cx="74" cy="86" r="5" fill="#000"/>
          <circle cx="77" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>
        <g id="eyeR">
          <ellipse cx="126" cy="86" rx="10" ry="13" fill="#fff"/>
          <circle id="pupilR" cx="126" cy="86" r="5" fill="#000"/>
          <circle cx="129" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>
        <path id="browL" d="M 62 68 Q 74 62 88 68" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>
        <path id="browR" d="M 112 68 Q 126 62 138 68" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>
        <path id="mouth" d="M 78 128 Q 100 138 122 128" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
        <g id="ear" transform="translate(150, 100)">
          <path d="M 0 0 C -6 -14, 4 -24, 12 -18 C 19 -12, 19 -2, 12 4 C 6 9, 0 7, 0 0 Z" fill="#fff"/>
          <path d="M 4 0 C 1 -9, 6 -16, 10 -12 C 14 -8, 14 -2, 10 2 C 7 4, 4 3, 4 0 Z" fill="#000" opacity="0.35"/>
        </g>
        <g id="hand" transform="translate(160, 130)">
          <path d="M 0 28 C -4 16, -2 6, 4 2 L 4 2 C 4 -4, 8 -6, 10 -4 L 12 -4 C 12 -10, 16 -12, 18 -8 L 20 -8 C 20 -14, 24 -16, 26 -12 L 28 -10 C 30 -6, 30 2, 28 10 C 26 20, 22 28, 16 30 C 8 32, 2 32, 0 28 Z" fill="#fff"/>
        </g>
      </svg>
    </div>
  </div>

  <div id="dialog"></div>
  <div id="status">готов</div>

  <div id="controls">
    <button id="talkBtn">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
  </div>

  <div id="chatInput">
    <input id="chatField" type="text" placeholder="Напиши сообщение…" autocomplete="off">
    <button id="chatSend">→</button>
  </div>
</div>

<div id="startScreen">
  <div id="startName"></div>
  <div id="startSub">voice assistant</div>
  <button id="startBtn">Начать</button>
</div>

<script>
/* ЭЛЕМЕНТЫ */
const face = document.getElementById('face');
const dialogEl = document.getElementById('dialog');
const statusEl = document.getElementById('status');
const talkBtn = document.getElementById('talkBtn');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const startName = document.getElementById('startName');
const chatField = document.getElementById('chatField');
const chatSend = document.getElementById('chatSend');

/* АНИМАЦИЯ ИМЕНИ */
['W','a','v','e',' ','A','I'].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  s.style.animationDelay = (i * 80) + 'ms';
  startName.appendChild(s);
});

/* ЗВУК КЛИКА (только кнопка, НЕ при слушании) */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playClick() {
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(1200, t + 0.05);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.15);
}

/* МУЖСКОЙ ГОЛОС — POLLINATIONS (живой), фолбэк на системный */
let currentAudio = null;
let lastSpokenText = '';
let useNeural = true;
const VOICE = 'echo'; // мужской живой

function stopSpeak() {
  if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
  try { speechSynthesis.cancel(); } catch(e){}
}

function speak(text, onEnd) {
  if (!text) { if (onEnd) onEnd(); return; }
  lastSpokenText = text;
  stopSpeak();

  face.classList.add('talking');
  face.classList.remove('listening');
  statusEl.textContent = 'говорит';
  statusEl.className = 'speaking';
  dialogEl.innerHTML = `<span class="wave">Wave</span>${text}`;

  if (useNeural) {
    try {
      const url = 'https://text.pollinations.ai/' + encodeURIComponent(text) +
                  '?model=openai-audio&voice=' + VOICE;
      const audio = new Audio(url);
      currentAudio = audio;
      audio.onended = () => {
        face.classList.remove('talking');
        statusEl.textContent = 'готов';
        statusEl.className = '';
        currentAudio = null;
        if (onEnd) onEnd();
      };
      audio.onerror = () => {
        useNeural = false;
        systemSpeak(text, onEnd);
      };
      const p = audio.play();
      if (p && p.catch) p.catch(() => { useNeural = false; systemSpeak(text, onEnd); });
      return;
    } catch(e) {
      useNeural = false;
      systemSpeak(text, onEnd);
      return;
    }
  }
  systemSpeak(text, onEnd);
}

function systemSpeak(text, onEnd) {
  if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1.0;
  u.pitch = 0.85; // чуть ниже — мужской оттенок
  const voices = speechSynthesis.getVoices();
  const male = voices.find(v => v.name && (v.name.includes('Yuri') || v.name.includes('Юрий')));
  const ru = male || voices.find(v => v.lang === 'ru-RU') || voices.find(v => v.lang && v.lang.startsWith('ru'));
  if (ru) u.voice = ru;
  u.onend = () => {
    face.classList.remove('talking');
    statusEl.textContent = 'готов';
    statusEl.className = '';
    if (onEnd) onEnd();
  };
  u.onerror = u.onend;
  speechSynthesis.speak(u);
}

/* ИИ */
const history = [];
const SYSTEM = 'Ты Wave AI, дружелюбный голосовой ассистент мужского пола. Отвечай коротко по-русски, 1-2 предложения, живо, естественно. Без смайликов и разметки.';

async function askAI(userText) {
  history.push({ role: 'user', content: userText });
  if (history.length > 20) history.splice(0, history.length - 20);
  try {
    const res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        messages: [{ role: 'system', content: SYSTEM }, ...history],
        temperature: 0.9,
        max_tokens: 120
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let reply = (data.choices && data.choices[0] && data.choices[0].message.content) || data.response || '';
    reply = String(reply).replace(/[*_`#]/g,'').replace(/\n+/g,' ').trim();
    if (!reply) reply = 'Хм, не знаю что сказать.';
    history.push({ role: 'assistant', content: reply });
    return reply;
  } catch (err) {
    console.warn('AI error:', err);
    return fallbackAnswer(userText);
  }
}

/* КОМАНДЫ */
function handleCommand(text) {
  const t = text.toLowerCase().trim();

  const math = tryMath(t);
  if (math !== null) return 'Получается ' + math + '.';

  if (t.includes('который час') || t.includes('сколько времени')) {
    const d = new Date();
    return 'Сейчас ' + d.getHours() + ' часов ' + d.getMinutes() + ' минут.';
  }
  if (t.includes('монетк')) return Math.random() < 0.5 ? 'Выпал орёл.' : 'Выпала решка.';
  if (t.includes('кубик')) return 'Выпало ' + (Math.floor(Math.random()*6)+1) + '.';

  if (t.includes('шутк') || t.includes('анекдот')) {
    const jokes = [
      'Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 равно DEC 25.',
      'Заходит нейросеть в бар, а бармен: вам как обычно? Нейросеть: я тут впервые.',
      'Что сказал один бит другому? Ты мне нравишься, но у нас разные байты.'
    ];
    return jokes[Math.floor(Math.random()*jokes.length)];
  }
  if (t.includes('факт')) {
    const facts = [
      'Осьминог имеет три сердца и голубую кровь.',
      'Бананы — это ягоды, а малина — нет.',
      'Свет от Солнца доходит до Земли за 8 минут 20 секунд.'
    ];
    return facts[Math.floor(Math.random()*facts.length)];
  }
  return null;
}

function tryMath(text) {
  let s = ' ' + text.toLowerCase() + ' ';
  s = s.replace(/\bплюс\b/g,'+').replace(/\bминус\b/g,'-')
       .replace(/\bумножить на\b/g,'*').replace(/\bразделить на\b/g,'/')
       .replace(/\bумножить\b/g,'*').replace(/\bразделить\b/g,'/');
  s = s.replace(/,/g,'.').replace(/[^0-9+\-*\/.\s()]/g,' ').trim();
  if (!/[0-9]/.test(s) || !/[+\-*\/]/.test(s)) return null;
  if (!/^[0-9+\-*\/.()\s]+$/.test(s)) return null;
  try {
    const r = Function('"use strict";return (' + s + ')')();
    if (typeof r !== 'number' || !isFinite(r)) return null;
    return Math.round(r * 10000) / 10000;
  } catch(e) { return null; }
}

function fallbackAnswer(text) {
  const t = text.toLowerCase();
  if (t.includes('привет')) return 'Привет! Как ты?';
  if (t.includes('как дела')) return 'Отлично! А у тебя как?';
  if (t.includes('кто ты')) return 'Я Wave AI, твой голосовой ассистент.';
  if (t.includes('пока')) return 'Пока! Возвращайся.';
  if (t.includes('спасибо')) return 'Пожалуйста!';
  return 'Интересно. Расскажи подробнее.';
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function processUserText(text) {
  if (!text || !text.trim()) return;
  dialogEl.innerHTML = `<span class="you">ты</span>${text}`;
  const cmd = handleCommand(text);
  if (cmd) { await sleep(200); speak(cmd); return; }
  statusEl.textContent = 'думает';
  statusEl.className = 'thinking';
  const reply = await askAI(text);
  speak(reply);
}

/* РАСПОЗНАВАНИЕ РЕЧИ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let finalText = '';

if (SR) {
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    face.classList.add('listening');
    talkBtn.classList.add('active', 'listening');
    statusEl.textContent = 'слушаю';
    statusEl.className = 'listening';
    finalText = '';
    dialogEl.innerHTML = '';
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) finalText += final;
    dialogEl.innerHTML = `<span class="you">ты</span>${(finalText + ' ' + interim).trim()}`;
  };

  recognition.onerror = (e) => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('active', 'listening');
    if (e.error === 'not-allowed') {
      dialogEl.textContent = 'Дай доступ к микрофону';
    }
    statusEl.textContent = 'готов';
    statusEl.className = '';
  };

  recognition.onend = () => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('active', 'listening');
    const t = finalText.trim();
    if (t) {
      processUserText(t);
    } else {
      // не расслышал
      statusEl.textContent = 'готов';
      statusEl.className = '';
      speak('Не расслышал. Повтори ещё раз.');
    }
  };
}

/* КНОПКИ */
talkBtn.onclick = () => {
  initAudio();
  playClick();
  if (!SR) { speak('Браузер не поддерживает микрофон.'); return; }
  if (isListening) { recognition.stop(); return; }
  stopSpeak();
  face.classList.remove('talking', 'waving');
  try { recognition.start(); } catch(e) { console.warn(e); }
};

chatSend.onclick = () => {
  const t = chatField.value.trim();
  if (!t) return;
  initAudio();
  playClick();
  chatField.value = '';
  stopSpeak();
  processUserText(t);
};
chatField.onkeydown = (e) => { if (e.key === 'Enter') chatSend.click(); };

/* МОРГАНИЕ */
function blink() {
  face.classList.add('blink');
  setTimeout(() => face.classList.remove('blink'), 120);
  setTimeout(blink, 2500 + Math.random() * 3500);
}
setTimeout(blink, 1500);

/* СТАРТ */
startBtn.onclick = () => {
  initAudio();
  playClick();
  startScreen.classList.add('hide');
  setTimeout(() => startScreen.remove(), 900);
  setTimeout(() => {
    face.classList.add('waving');
    speak('Привет! Я Wave AI. Буду с тобой сегодня разговаривать.', () => {
      setTimeout(() => face.classList.remove('waving'), 300);
    });
  }, 400);
};

document.body.addEventListener('touchstart', () => initAudio(), { once: true });
document.body.addEventListener('click', () => initAudio(), { once: true });
</script>
</body>
