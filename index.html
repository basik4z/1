(function(){
  var splashEl=document.getElementById('splash');
  var splashContent=document.getElementById('splashContent');
  var splashBarEl=document.getElementById('splashBar');
  var splashPctEl=document.getElementById('splashPct');
  var sweepPathEl=document.getElementById('sweepPath');
  if(!splashEl)return;
  var pct=0;
  var timer=setInterval(function(){
    pct+=Math.random()*3+1;
    if(pct>100)pct=100;
    splashBarEl.style.width=pct+'%';
    splashPctEl.textContent=Math.floor(pct)+'%';
    if(pct>=100){clearInterval(timer);setTimeout(runWave,400)}
  },50);
  function runWave(){
    splashContent.classList.add('lift');
    var start=performance.now();var dur=1100;
    function step(now){
      var p=Math.min((now-start)/dur,1);
      var ease=1-Math.pow(1-p,3);
      var y=-100+ease*1000;
      var wave='M 0 '+y;
      for(var x=0;x<=400;x+=20){
        var off=Math.sin(x*0.03+p*10)*35;
        wave+=' Q '+(x+10)+' '+(y+off)+' '+(x+20)+' '+y;
      }
      wave+=' L 400 0 L 0 0 Z';
      sweepPathEl.setAttribute('d',wave);
      if(p<1){requestAnimationFrame(step)}
      else{splashEl.style.display='none';app.classList.add('show')}
    }
    requestAnimationFrame(step);
  }
})();

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,voiceRec=null,voiceIsListening=false,voiceFinal='';
if(SR){voiceRec=new SR();voiceRec.lang='ru-RU';voiceRec.interimResults=true;voiceRec.continuous=false;
voiceRec.onstart=function(){voiceIsListening=true;document.getElementById('voiceOverlay').classList.add('listening');voiceFinal=''};
voiceRec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript}voiceFinal=t;document.getElementById('voiceTitle').textContent=t};
voiceRec.onerror=function(){voiceIsListening=false;document.getElementById('voiceOverlay').classList.remove('listening')};
voiceRec.onend=function(){voiceIsListening=false;document.getElementById('voiceOverlay').classList.remove('listening');var t=voiceFinal.trim();if(t){document.getElementById('voiceOverlay').classList.remove('show');addMsg('user',t);showTyping();askAI(t).then(function(rep){hideTyping();addMsg('wave',rep);speak(rep)})}}}
document.getElementById('voiceOpenBtn').onclick=function(){haptic();initAudio();playClick();stopSpeak();document.getElementById('voiceOverlay').classList.add('show');document.getElementById('voiceTitle').textContent='Нажми и говори';document.getElementById('voiceSub').textContent='ГОТОВ'};
document.getElementById('voiceExitBtn').onclick=function(){haptic();initAudio();playClick();if(voiceIsListening&&voiceRec)voiceRec.stop();stopSpeak();document.getElementById('voiceOverlay').classList.remove('show')};
document.getElementById('voiceBtn').onclick=function(){haptic();initAudio();playClick();if(!voiceRec){document.getElementById('voiceTitle').textContent='Микрофон не поддерживается';return}if(voiceIsListening){voiceRec.stop();return}stopSpeak();try{voiceRec.start()}catch(e){}};
var authDone=false;
function runAuth(){if(authDone){toastMsg('Устройство уже авторизовано');return}var as=document.getElementById('authScreen'),ac=document.getElementById('authContent');ac.innerHTML='';as.classList.add('show');var lines=['Wave AI Auth System v2.0','','> Инициализация...','> Проверка устройства...','> Серийный номер: '+Math.random().toString(36).substring(2,10).toUpperCase(),'> Платформа: '+(/iPhone/.test(navigator.userAgent)?'iOS':/Android/.test(navigator.userAgent)?'Android':'Desktop'),'> Экран: '+screen.width+'x'+screen.height,'> Соединение: '+(navigator.onLine?'OK':'OFFLINE'),'> Проверка подписи...','> Дешифровка ключа...','> Верификация...','','> ✅ УСТРОЙСТВО АВТОРИЗОВАНО','','Добро пожаловать в Wave AI.'];var i=0;function next(){if(i>=lines.length){setTimeout(function(){as.classList.remove('show');authDone=true;toastMsg('Устройство авторизовано ✅')},1200);return}var d=document.createElement('div');d.className='al'+(lines[i].indexOf('✅')>=0?' ok':'');d.textContent=lines[i]||' ';ac.appendChild(d);i++;setTimeout(next,180+Math.random()*150)}next()}
document.getElementById('authMenuBtn').onclick=function(){haptic();playClick();document.getElementById('chatsPanel').classList.remove('show');runAuth()};
function runTerminal(){var ts=document.getElementById('terminalScreen'),tc=document.getElementById('terminalContent');tc.innerHTML='';ts.classList.add('show');var lines=[{t:'Инициализация Wave AI...',c:'info'},{t:'Проверка соединения......... <span class="ok">OK</span>'},{t:'Загрузка ресурсов........... <span class="ok">OK</span>'},{t:'Подготовка ссылки для установки...',c:'dim'},{t:'Сборка приложения........... <span class="ok">OK</span>'},{t:'Генерация иконки............ <span class="ok">OK</span>'},{t:'Проверка совместимости...... <span class="ok">OK</span>'},{t:'',c:''},{t:'> Сайт собирается установить приложение Wave AI',c:'info'},{t:'',c:''},{t:'> Готово! Закрой окно.',c:'info'}];var i=0;function next(){if(i>=lines.length)return;var l=lines[i];var d=document.createElement('div');d.className='tl';if(l.c==='info')d.innerHTML='<span class="info">'+l.t+'</span>';else if(l.c==='dim')d.innerHTML='<span class="dim">'+l.t+'</span>';else d.innerHTML='<span class="p">$</span>'+l.t;tc.appendChild(d);i++;setTimeout(next,300+Math.random()*250)}next()}
document.getElementById('terminalMenuBtn').onclick=function(){haptic();playClick();document.getElementById('chatsPanel').classList.remove('show');runTerminal()};
document.getElementById('terminalClose').onclick=function(){haptic();playClick();document.getElementById('terminalScreen').classList.remove('show')};

document.getElementById('classicBack').onclick=function(){haptic();playClick();document.getElementById('classicScreen').classList.remove('show')};
var cSR=window.SpeechRecognition||window.webkitSpeechRecognition,cRec=null,cListening=false,cFinal='';
if(cSR){cRec=new cSR();cRec.lang='ru-RU';cRec.interimResults=true;cRec.continuous=false;
cRec.onstart=function(){cListening=true;cFinal='';document.getElementById('classicDialog').innerHTML='<span class="you">ты</span>…';document.getElementById('classicFace').classList.add('listening')};
cRec.onresult=function(e){var t='';for(var i=e.resultIndex;i<e.results.length;i++){t+=e.results[i][0].transcript}cFinal=t;document.getElementById('classicDialog').innerHTML='<span class="you">ты</span>'+t};
cRec.onerror=function(){cListening=false;document.getElementById('classicFace').classList.remove('listening');document.getElementById('classicDialog').textContent=''};
