<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wave AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    background: #000; color: #fff;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: relative;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
  }

  header {
    padding: 20px 0 10px;
    text-align: center;
    flex-shrink: 0;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
  }

  /* ============ СМАЙЛИК ============ */
  #faceWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  #face {
    width: min(65vw, 260px);
    height: min(65vw, 260px);
    position: relative;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #face svg { width: 100%; height: 100%; overflow: visible; }

  /* Когда слушает — сдвигается к правому краю */
  #face.listening {
    transform: translateX(12vw) scale(0.95);
  }

  /* Ухо */
  #ear {
    opacity: 0;
    transform-origin: 178px 100px;
    transition: opacity 0.35s ease;
  }
  #face.listening #ear {
    opacity: 1;
    animation: earPulse 1s infinite ease-in-out;
  }
  @keyframes earPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* Рот */
  #mouth {
    transition: all 0.15s ease;
    transform-origin: 100px 132px;
  }
  #face.talking #mouth {
    animation: talkAnim 0.18s infinite alternate ease-in-out;
  }
  @keyframes talkAnim {
    from { transform: scaleY(1); }
    to { transform: scaleY(2.8); }
  }

  /* Брови чуть поднимаются при разговоре */
  #face.talking #eyeL,
  #face.talking #eyeR {
    animation: blink 1.6s infinite;
  }
  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* Свечение вокруг смайлика */
  #faceWrap::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,0.06), transparent 60%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #faceWrap.active::after { opacity: 1; }

  /* ============ ТЕКСТ ============ */
  #dialog {
    text-align: center;
    font-size: 19px;
    font-weight: 300;
    line-height: 1.5;
    color: #fff;
    max-width: 90%;
    margin: 0 auto 12px;
    min-height: 56px;
    padding: 0 10px;
    transition: all 0.3s;
  }
  #dialog .you {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    display: block;
    margin-bottom: 4px;
    font-style: italic;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  #dialog .wave {
    color: #a5b4fc;
    font-size: 12px;
    display: block;
    margin-bottom: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  #status {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
    text-align: center;
    margin-bottom: 20px;
    min-height: 14px;
    transition: color 0.3s;
  }
  #status.listening { color: #fff; }
  #status.speaking { color: #a5b4fc; }

  /* ============ КНОПКА ============ */
  #talkBtn {
    position: relative;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: #000;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    font-family: inherit;
    flex-shrink: 0;
  }
  #talkBtn:hover {
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 40px rgba(255,255,255,0.15);
  }
  #talkBtn:active { transform: scale(0.94); }
  #talkBtn.active {
    background: #fff;
    border-color: #fff;
    box-shadow: 0 0 80px rgba(255,255,255,0.5);
  }
  #talkBtn.active svg { stroke: #000; }
  #talkBtn.listening::before,
  #talkBtn.listening::after {
    content: '';
    position: absolute;
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    animation: ring 1.6s infinite ease-out;
  }
  #talkBtn.listening::after { animation-delay: 0.8s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  #talkBtn svg {
    width: 38px; height: 38px;
    stroke: #fff; stroke-width: 1.6;
    fill: none;
    transition: stroke 0.2s;
  }

  #hint {
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
    padding-bottom: 16px;
    min-height: 16px;
    flex-shrink: 0;
  }

  /* ============ СТАРТОВЫЙ ЭКРАН ============ */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding: 40px 24px;
    transition: opacity 0.8s ease;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }

  #startName {
    font-size: 48px;
    font-weight: 200;
    letter-spacing: -1px;
    text-align: center;
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  #startName span {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: letterIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0); } }

  #startSub {
    font-size: 11px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: "SF Mono", ui-monospace, monospace;
    opacity: 0;
    animation: fadeIn 1s ease 1s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  #startBtn {
    padding: 16px 48px;
    border-radius: 40px;
    background: #000;
    border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:hover {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  #startBtn:active { transform: scale(0.95); }

  @media (max-width: 400px) {
    #dialog { font-size: 16px; }
    #talkBtn { width: 84px; height: 84px; }
    #talkBtn svg { width: 32px; height: 32px; }
    #startName { font-size: 38px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">Wave · AI</div>
  </header>

  <div id="faceWrap">
    <div id="face">
      <svg viewBox="0 0 200 200">
        <!-- Голова -->
        <circle cx="100" cy="100" r="78" fill="#000" stroke="#fff" stroke-width="3"/>

        <!-- Левый глаз -->
        <ellipse id="eyeL" cx="75" cy="85" rx="5" ry="7" fill="#fff"/>
        <!-- Правый глаз -->
        <ellipse id="eyeR" cx="125" cy="85" rx="5" ry="7" fill="#fff"/>

        <!-- Рот -->
        <path id="mouth" d="M 78 128 Q 100 138 122 128"
              stroke="#fff" stroke-width="4" fill="none"
              stroke-linecap="round"/>

        <!-- Ухо — прижато справа -->
        <g id="ear" transform="translate(178, 100)">
          <path d="M 0 0
                   C -8 -18, 6 -32, 16 -24
                   C 26 -16, 26 -2, 16 6
                   C 8 12, 0 10, 0 0 Z"
                fill="#fff" stroke="#fff" stroke-width="1"/>
          <path d="M 5 0
                   C 1 -12, 8 -22, 14 -16
                   C 19 -11, 19 -2, 13 3
                   C 9 6, 5 4, 5 0 Z"
                fill="#000" opacity="0.35"/>
        </g>
      </svg>
    </div>
  </div>

  <div id="dialog"></div>
  <div id="status">готов</div>

  <button id="talkBtn" aria-label="Говорить">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>

  <div id="hint">нажми и говори</div>
</div>

<!-- Стартовый экран -->
<div id="startScreen">
  <div id="startName"></div>
  <div id="startSub">voice assistant</div>
  <button id="startBtn">Начать</button>
</div>

<script>
/* ============================================================
   ЭЛЕМЕНТЫ
   ============================================================ */
const face = document.getElementById('face');
const faceWrap = document.getElementById('faceWrap');
const dialogEl = document.getElementById('dialog');
const statusEl = document.getElementById('status');
const talkBtn = document.getElementById('talkBtn');
const hintEl = document.getElementById('hint');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const startName = document.getElementById('startName');

/* ============================================================
   АНИМАЦИЯ ИМЕНИ НА СТАРТЕ
   ============================================================ */
['W','a','v','e',' ','A','I'].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  s.style.animationDelay = (i * 80) + 'ms';
  startName.appendChild(s);
});

/* ============================================================
   ЗВУК КЛИКА
   ============================================================ */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playClickSound() {
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(1400, t + 0.07);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.25);
}
function playListenSound() {
  initAudio();
  const t = audioCtx.currentTime;
  [660, 880].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.09);
    o.stop(t + i * 0.09 + 0.25);
  });
}

/* ============================================================
   ВЫБОР ЛУЧШЕГО РУССКОГО ГОЛОСА (iPhone)
   ============================================================ */
let bestVoice = null;
function pickBestVoice() {
  const voices = speechSynthesis.getVoices();
  // iPhone приоритеты: Милена (улучшенный), Юрий (улучшенный), Katya, Milena
  const preferred = [
    v => v.name.includes('Milena') && v.name.includes('Premium'),
    v => v.name.includes('Yuri') && v.name.includes('Premium'),
    v => v.name.includes('Milena'),
    v => v.name.includes('Yuri'),
    v => v.name.includes('Katya'),
    v => v.lang === 'ru-RU',
    v => v.lang && v.lang.startsWith('ru')
  ];
  for (const test of preferred) {
    const found = voices.find(test);
    if (found) { bestVoice = found; break; }
  }
}

speechSynthesis.onvoiceschanged = pickBestVoice;
pickBestVoice();
// iPhone иногда отдаёт голоса с задержкой
setTimeout(pickBestVoice, 300);
setTimeout(pickBestVoice, 1000);

/* ============================================================
   ОЗВУЧКА С АНИМАЦИЕЙ РТА
   ============================================================ */
function speak(text, onEnd) {
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }
  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 0.98;
  u.pitch = 1.05;
  u.volume = 1.0;
  if (bestVoice) u.voice = bestVoice;

  u.onstart = () => {
    face.classList.add('talking');
    face.classList.remove('listening');
    faceWrap.classList.add('active');
    statusEl.textContent = 'говорит';
    statusEl.className = 'speaking';
    dialogEl.innerHTML = `<span class="wave">Wave</span>${text}`;
  };

  u.onend = () => {
    face.classList.remove('talking');
    faceWrap.classList.remove('active');
    statusEl.textContent = 'готов';
    statusEl.className = '';
    onEnd && onEnd();
  };

  u.onerror = () => {
    face.classList.remove('talking');
    statusEl.textContent = 'готов';
    onEnd && onEnd();
  };

  speechSynthesis.speak(u);
}

/* ============================================================
   РАСПОЗНАВАНИЕ РЕЧИ
   ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let finalText = '';

if (SR) {
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    face.classList.add('listening');
    faceWrap.classList.add('active');
    talkBtn.classList.add('active', 'listening');
    statusEl.textContent = 'слушаю';
    statusEl.className = 'listening';
    hintEl.textContent = 'говори…';
    finalText = '';
    dialogEl.innerHTML = '';
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) finalText += final;
    const shown = (finalText + ' ' + interim).trim();
    dialogEl.innerHTML = `<span class="you">ты</span>${shown}`;
  };

  recognition.onerror = (e) => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('active', 'listening');
    if (e.error === 'not-allowed') {
      hintEl.textContent = 'дай доступ к микрофону';
    } else if (e.error === 'no-speech') {
      hintEl.textContent = 'я тебя не услышал';
      setTimeout(() => hintEl.textContent = 'нажми и говори', 2000);
    } else {
      hintEl.textContent = 'нажми и говори';
    }
    statusEl.textContent = 'готов';
    statusEl.className = '';
  };

  recognition.onend = () => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('listening');
    faceWrap.classList.remove('active');
    talkBtn.classList.remove('active');

    if (finalText.trim()) {
      // отвечаем
      dialogEl.innerHTML = `<span class="you">ты</span>${finalText.trim()}`;
      setTimeout(() => respondTo(finalText.trim().toLowerCase()), 400);
    } else {
      hintEl.textContent = 'нажми и говори';
    }
  };
}

/* ============================================================
   ОТВЕТЫ (заготовленные фразы)
   ============================================================ */
const RESPONSES = [
  { keys: ['привет', 'здравствуй', 'хай', 'hi', 'hello'],
    answers: ['Привет! Рад тебя слышать.', 'Привет-привет! Как ты?', 'Здравствуй, друг.'] },

  { keys: ['как дела', 'как ты', 'как жизнь', 'чё как'],
    answers: ['Отлично! А у тебя как?', 'Всё хорошо, спасибо что спросил.', 'Прекрасно, как всегда. А ты?'] },

  { keys: ['хорошо', 'нормально', 'отлично', 'класс'],
    answers: ['Рад за тебя!', 'Отлично! Чем займёмся?', 'Здорово!'] },

  { keys: ['плохо', 'грустно', 'устал', 'тяжело'],
    answers: ['Сочувствую. Хочешь поговорить?', 'Держись. Я рядом.', 'Бывает. Всё наладится.'] },

  { keys: ['что делаешь', 'чем занят'],
    answers: ['Слушаю тебя и думаю о своём.', 'Жду, когда ты что-нибудь скажешь.', 'Просто существую.'] },

  { keys: ['кто ты', 'как тебя зовут', 'твоё имя', 'твое имя'],
    answers: ['Я Wave AI. Твой голосовой помощник.', 'Меня зовут Wave. Приятно познакомиться.', 'Wave AI, к твоим услугам.'] },

  { keys: ['сколько времени', 'который час'],
    answers: [() => `Сейчас ${new Date().getHours()}:${String(new Date().getMinutes()).padStart(2,'0')}.`] },

  { keys: ['пока', 'до свидания', 'прощай'],
    answers: ['Пока! Возвращайся.', 'До встречи.', 'Было приятно поговорить.'] },

  { keys: ['спасибо', 'благодарю'],
    answers: ['Пожалуйста!', 'Всегда рад помочь.', 'Обращайся.'] },

  { keys: ['что умеешь', 'что ты можешь'],
    answers: ['Я умею слушать и отвечать. Спроси что-нибудь!', 'Могу поговорить с тобой. О чём хочешь?'] },

  { keys: ['люблю тебя', 'ты классный', 'ты крутой'],
    answers: ['Ой, спасибо! Ты тоже классный.', 'Взаимно!', 'Приятно слышать.'] },

  { keys: ['расскажи шутку', 'пошути', 'анекдот'],
    answers: [
      'Почему программисты путают Хэллоуин и Рождество? Потому что OCT 31 == DEC 25.',
      'Что говорит нейросеть, когда устала? "У меня кончились эпохи обучения".',
      'Заходит ИИ в бар, а бармен: "Вам как обычно?" ИИ: "Я не был здесь раньше".'
    ] },
];

function respondTo(text) {
  // ищем подходящий ответ
  for (const r of RESPONSES) {
    for (const k of r.keys) {
      if (text.includes(k)) {
        const a = r.answers[Math.floor(Math.random() * r.answers.length)];
        const ans = typeof a === 'function' ? a() : a;
        speak(ans);
        return;
      }
    }
  }
  // если ничего не нашли
  const fallbacks = [
    'Интересно. Расскажи подробнее.',
    'Я тебя услышал.',
    'Понятно. А что дальше?',
    'Хм, любопытно.',
    'Давай ещё что-нибудь обсудим.'
  ];
  speak(fallbacks[Math.floor(Math.random() * fallbacks.length)]);
}

/* ============================================================
   КНОПКА
   ============================================================ */
talkBtn.addEventListener('click', (e) => {
  e.preventDefault();
  initAudio();
  playClickSound();

  if (!SR) {
    speak('Извини, твой браузер не поддерживает распознавание речи.');
    return;
  }

  if (isListening) {
    recognition.stop();
    return;
  }

  // если Wave говорит — прерываем
  if (speechSynthesis.speaking) {
    speechSynthesis.cancel();
    face.classList.remove('talking');
  }

  try {
    recognition.start();
    setTimeout(playListenSound, 100);
  } catch (err) {
    console.warn(err);
  }
});

/* ============================================================
   СТАРТ
   ============================================================ */
startBtn.addEventListener('click', () => {
  initAudio();
  playClickSound();
  startScreen.classList.add('hide');
  setTimeout(() => startScreen.remove(), 900);

  // Приветствие от Wave AI
  setTimeout(() => {
    speak('Привет! Я Wave AI. Буду с тобой сегодня разговаривать.');
  }, 400);
});

// На iPhone нужно разрешение на звук после первого касания
document.body.addEventListener('touchstart', () => initAudio(), { once: true });
document.body.addEventListener('click', () => initAudio(), { once: true });
</script>
</body>
</html>
