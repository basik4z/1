<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wave AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#001f3f">
<title>Wave AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background-size:400% 400%;animation:gS 15s ease infinite;transition:background 1.2s}
@keyframes gS{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#bg.wave{background:linear-gradient(135deg,#001f3f,#0074D9,#39CCCC,#0074D9);background-size:400% 400%}
#bg.lion{background:linear-gradient(135deg,#7c2d12,#ea580c,#fbbf24,#ea580c);background-size:400% 400%}
#bg.crocodile{background:linear-gradient(135deg,#052e16,#166534,#4ade80,#166534);background-size:400% 400%}
#bg.dragon{background:linear-gradient(135deg,#450a0a,#dc2626,#f87171,#dc2626);background-size:400% 400%}
#bg.panda{background:linear-gradient(135deg,#1f1f1f,#525252,#fbcfe8,#525252);background-size:400% 400%}
#bg.tiger{background:linear-gradient(135deg,#1c1917,#ea580c,#fbbf24,#ea580c);background-size:400% 400%}
#bg.frog{background:linear-gradient(135deg,#022c22,#059669,#6ee7b7,#059669);background-size:400% 400%}
#bg.wolf{background:linear-gradient(135deg,#0a0a0a,#404040,#a3a3a3,#404040);background-size:400% 400%}
#bg.shark{background:linear-gradient(135deg,#082f49,#0284c7,#67e8f9,#0284c7);background-size:400% 400%}
#bg.bee{background:linear-gradient(135deg,#000,#ca8a04,#fde047,#ca8a04);background-size:400% 400%}
#bg.moon{background:linear-gradient(135deg,#0a0a1a,#1e1b4b,#312e81,#1e1b4b);background-size:400% 400%}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fxb{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.3);animation:bu linear infinite}
@keyframes bu{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-105vh);opacity:0}}
.fxr{position:absolute;top:-100px;width:80px;height:400px;background:linear-gradient(180deg,rgba(255,255,200,.4),transparent);transform-origin:top center;animation:rp 5s ease-in-out infinite}
@keyframes rp{0%,100%{opacity:.3;transform:rotate(-8deg)}50%{opacity:.8;transform:rotate(8deg)}}
.fxw{position:absolute;bottom:0;left:0;width:200%;height:100px;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.4) 0,transparent 70%);border-radius:50% 50% 0 0;animation:wm 7s linear infinite}
@keyframes wm{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.fxd{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,220,50,.7);animation:fa linear infinite}
@keyframes fa{0%,100%{transform:translate(0,0)}25%{transform:translate(80px,-40px)}50%{transform:translate(-40px,-90px)}75%{transform:translate(60px,-30px)}}
.fxs{position:absolute;bottom:-60px;width:100px;height:100px;background:radial-gradient(circle,rgba(200,200,200,.5),transparent 70%);border-radius:50%;animation:sm linear infinite}
@keyframes sm{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:.7}100%{transform:translateY(-105vh) scale(2.5);opacity:0}}
.fxc{position:absolute;bottom:30px;left:-200px;font-size:60px;animation:croc linear infinite}
@keyframes croc{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(calc(100vw + 300px)) scaleX(1)}50%{transform:translateX(calc(100vw + 300px)) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.fxm{position:absolute;top:8%;right:10%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#e5e7eb,#9ca3af);box-shadow:0 0 60px rgba(255,255,255,.5);animation:mg 4s ease-in-out infinite}
@keyframes mg{0%,100%{box-shadow:0 0 60px rgba(255,255,255,.5)}50%{box-shadow:0 0 100px rgba(255,255,255,.9)}}
.fxstar{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#splash{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .8s;background:#000}
#splash.gone{opacity:0}
#splashName{font-size:54px;font-weight:200;color:#fff;text-shadow:0 0 60px rgba(57,204,204,.9);z-index:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px;position:relative;letter-spacing:-2px}
#splashName span{display:inline-block;opacity:0;transform:translateY(40px) scale(.5);animation:li .8s cubic-bezier(.34,1.56,.64,1) forwards}
#splashEmoji{font-size:70px;opacity:0;animation:li .8s 1s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes li{to{opacity:1;transform:translateY(0) scale(1)}}
#waveSweep{position:absolute;inset:0;z-index:3;pointer-events:none}
#waveSweep svg{width:100%;height:100%}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;opacity:0;transition:opacity .6s;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));padding-left:16px;padding-right:16px}
#app.show{opacity:1}
header{padding:8px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.brand{font-size:11px;letter-spacing:7px;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:500}
.hbtns{display:flex;gap:6px}
.hbtn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:16px;transition:all .2s}
.hbtn:active{transform:scale(.9);background:rgba(255,255,255,.35)}
#faceWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#face{width:min(58vw,230px);height:min(58vw,230px);position:relative;transition:transform .6s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 40px rgba(255,255,255,.4))}
#face svg{width:100%;height:100%;overflow:visible}
#face.listening{transform:scale(.92)}
#face.spraying{animation:spA .6s infinite}
@keyframes spA{0%,100%{transform:rotate(-3deg) scale(.95)}50%{transform:rotate(3deg) scale(1.05)}}
#sprayCan{opacity:0;transition:opacity .3s}
#face.spraying #sprayCan{opacity:1;animation:spW .4s infinite}
@keyframes spW{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
#ear{opacity:0;transform-origin:150px 100px;transition:opacity .35s}
#face.listening #ear{opacity:1;animation:eP 1s infinite ease-in-out}
@keyframes eP{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
#hand{opacity:0;transform-origin:190px 150px;transition:opacity .3s}
#face.waving #hand{opacity:1;animation:wH .5s 4 ease-in-out}
@keyframes wH{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg)}}
#mouth{transition:all .15s;transform-origin:100px 130px}
#face.talking #mouth{animation:tA .18s infinite alternate}
@keyframes tA{from{transform:scaleY(1)}to{transform:scaleY(2.8)}}
#face.sad #mouth{transform:translateY(-6px) scaleY(.6) scaleX(.7)}
#face.angry #mouth{transform:translateY(4px) scaleY(1.3) scaleX(.8)}
#face.surprised #mouth{transform:scaleY(2.5) scaleX(.6)}
#face.happy #mouth{transform:translateY(2px) scaleY(1.3) scaleX(1.2)}
#eyeL,#eyeR{transform-origin:center;transition:transform .1s}
#face.blink #eyeL,#face.blink #eyeR{transform:scaleY(.08)}
#face.sad #eyeL,#face.sad #eyeR{transform:scaleY(.7)}
#browL,#browR{transition:all .3s;opacity:0}
#face.listening #browL,#face.listening #browR{opacity:1}
#pupilL,#pupilR{transition:transform .4s}
#face.listening #pupilL,#face.listening #pupilR{transform:translate(3px,0)}
#face.talking #eyeL,#face.talking #eyeR{transform:scaleY(.75)}
#dialog{text-align:center;font-size:16px;font-weight:300;line-height:1.5;color:#fff;max-width:92%;margin:0 auto 8px;min-height:44px;padding:0 12px;overflow-y:auto;max-height:20vh;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#dialog .you{color:rgba(255,255,255,.6);font-size:11px;display:block;margin-bottom:4px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
#dialog .wave{color:rgba(255,255,255,.85);font-size:11px;display:block;margin-bottom:4px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}
#imgBox{margin:0 auto 8px;max-width:75%;display:none;animation:iI .6s cubic-bezier(.34,1.56,.64,1)}
#imgBox.show{display:block}
@keyframes iI{from{opacity:0;transform:scale(.5) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
#imgBox img{width:100%;border-radius:22px;border:2px solid rgba(255,255,255,.5);box-shadow:0 12px 50px rgba(0,0,0,.6)}
#attached{max-width:60%;margin:0 auto 8px;display:none;position:relative}
#attached.show{display:block}
#attached img{width:100%;border-radius:16px;border:2px solid rgba(255,255,255,.5)}
#attached .rm{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:#dc2626;color:#fff;border:2px solid #fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit;font-weight:700}
#status{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.6);text-align:center;margin-bottom:10px;min-height:14px;flex-shrink:0;font-weight:600}
#status.listening{color:#fff}
#status.speaking{color:#39CCCC}
#status.thinking{color:#FFDC00}
#quick{display:flex;gap:6px;padding:0 0 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
.qbtn{flex-shrink:0;padding:9px 16px;border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;font-weight:500}
.qbtn:active{transform:scale(.94);background:rgba(255,255,255,.35)}
#controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:12px;flex-shrink:0}
#talkBtn{position:relative;width:88px;height:88px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:2px solid rgba(255,255,255,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#talkBtn:active{transform:scale(.92)}
#talkBtn.active{background:#fff;border-color:#fff;box-shadow:0 0 80px rgba(255,255,255,.9)}
#talkBtn.active svg{stroke:#0074D9}
#talkBtn.listening::before,#talkBtn.listening::after{content:'';position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.7);animation:rng 1.8s infinite ease-out}
#talkBtn.listening::after{animation-delay:.9s}
@keyframes rng{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.9);opacity:0}}
#talkBtn svg{width:36px;height:36px;stroke:#fff;stroke-width:1.8;fill:none}
.ctrlbtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:20px}
.ctrlbtn:active{transform:scale(.88);background:rgba(255,255,255,.35)}
#chatInput{display:flex;padding:0 0 8px;gap:6px;flex-shrink:0;align-items:center}
#chatInput input[type=text]{flex:1;padding:13px 18px;border-radius:24px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:15px;font-family:inherit;outline:none}
#chatInput input[type=text]::placeholder{color:rgba(255,255,255,.6)}
#chatInput button{padding:0 20px;height:46px;border-radius:24px;background:#fff;color:#001f3f;border:none;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
#attachBtn{padding:0;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:19px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#fileInput{display:none}
.panel{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:none;flex-direction:column;padding:max(60px,env(safe-area-inset-top)) 24px 30px;overflow-y:auto}
.panel.show{display:flex}
.panel h3{font-size:24px;margin-bottom:20px;font-weight:600}
.panelClose{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
.theme-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.theme-item{padding:18px 14px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);cursor:pointer;font-family:inherit;color:#fff;text-align:center}
.theme-item.active{border-color:#fff;background:rgba(255,255,255,.25)}
.theme-item .em{font-size:36px;display:block;margin-bottom:8px}
.theme-item .nm{font-size:13px;font-weight:500}
#chatList{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.chat-item{padding:16px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.chat-item.active{border-color:#fff;background:rgba(255,255,255,.2)}
.chat-item .info{flex:1;min-width:0}
.chat-item .title{font-size:14px;font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .meta{font-size:11px;color:rgba(255,255,255,.6)}
.chat-item .del{width:32px;height:32px;border-radius:50%;background:rgba(220,38,38,.3);border:1px solid rgba(220,38,38,.5);color:#fff;font-size:14px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.newChatBtn{padding:16px;border-radius:18px;background:linear-gradient(135deg,#0074D9,#39CCCC);border:none;color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:16px}
#voiceMode{position:fixed;inset:0;z-index:800;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 40px}
#voiceMode.show{display:flex}
#voiceMode.show.bg-wave{background:radial-gradient(circle at 50% 40%,#0074D9,#001f3f 60%,#000)}
#voiceMode.show.bg-lion{background:radial-gradient(circle at 50% 40%,#ea580c,#7c2d12 60%,#000)}
#voiceMode.show.bg-crocodile{background:radial-gradient(circle at 50% 40%,#166534,#052e16 60%,#000)}
#voiceMode.show.bg-dragon{background:radial-gradient(circle at 50% 40%,#dc2626,#450a0a 60%,#000)}
#voiceMode.show.bg-panda{background:radial-gradient(circle at 50% 40%,#525252,#1f1f1f 60%,#000)}
#voiceMode.show.bg-tiger{background:radial-gradient(circle at 50% 40%,#ea580c,#1c1917 60%,#000)}
#voiceMode.show.bg-frog{background:radial-gradient(circle at 50% 40%,#059669,#022c22 60%,#000)}
#voiceMode.show.bg-wolf{background:radial-gradient(circle at 50% 40%,#404040,#0a0a0a 60%,#000)}
#voiceMode.show.bg-shark{background:radial-gradient(circle at 50% 40%,#0284c7,#082f49 60%,#000)}
#voiceMode.show.bg-bee{background:radial-gradient(circle at 50% 40%,#ca8a04,#000 60%,#000)}
#voiceMode.show.bg-moon{background:radial-gradient(circle at 50% 40%,#312e81,#0a0a1a 60%,#000)}
#voiceExit{position:absolute;top:max(20px,env(safe-area-inset-top));left:20px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center}
#voiceOrb{width:min(75vw,300px);height:min(75vw,300px);position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:40px}
.orb-ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.orb-ring.r1{inset:0;animation:op 3s ease-in-out infinite}
.orb-ring.r2{inset:-15px;animation:op 3s ease-in-out infinite .5s;opacity:.6}
.orb-ring.r3{inset:-30px;animation:op 3s ease-in-out infinite 1s;opacity:.3}
@keyframes op{0%,100%{transform:scale(1)}50%{transform:scale(1.05);opacity:.2}}
#voiceMode.listening .orb-ring{border-color:rgba(74,222,128,.8)}
#voiceMode.speaking .orb-ring{border-color:rgba(57,204,204,.9)}
#voiceFace{width:70%;height:70%;position:relative;filter:drop-shadow(0 0 60px rgba(255,255,255,.5))}
#voiceFace svg{width:100%;height:100%}
#voiceMode.speaking #vMouth{animation:vT .18s infinite alternate;transform-origin:100px 130px}
@keyframes vT{from{transform:scaleY(1)}to{transform:scaleY(2.8)}}
#voiceMode.listening #vPupilL,#voiceMode.listening #vPupilR{transform:translate(4px,0);transition:transform .4s}
#voiceText{font-size:22px;font-weight:300;color:#fff;text-align:center;max-width:90%;line-height:1.4;margin-bottom:12px;min-height:60px;padding:0 10px}
#voiceStatus{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:40px;min-height:14px;font-weight:600}
#voiceStatus.listening{color:#4ade80}
#voiceStatus.speaking{color:#39CCCC}
#voiceStatus.thinking{color:#FFDC00}
#voiceTalkBtn{width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:2px solid rgba(255,255,255,.6);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
#voiceTalkBtn:active{transform:scale(.92)}
#voiceTalkBtn.active{background:#fff;border-color:#fff;box-shadow:0 0 100px rgba(255,255,255,.9)}
#voiceTalkBtn.active svg{stroke:#000}
#voiceTalkBtn.listening::before,#voiceTalkBtn.listening::after{content:'';position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid rgba(74,222,128,.7);animation:rng 1.8s infinite ease-out}
#voiceTalkBtn.listening::after{animation-delay:.9s}
#voiceTalkBtn svg{width:40px;height:40px;stroke:#fff;stroke-width:1.8;fill:none}
</style>
</head>
<body>
<div id="bg" class="wave"></div>
<div id="fx"></div>
<div id="splash">
  <div id="splashName"></div>
  <svg id="waveSweep" viewBox="0 0 400 800" preserveAspectRatio="none"><path id="sweepPath" d="M 0 900 Q 100 900 200 900 T 400 900 L 400 900 L 0 900 Z" fill="#001f3f"/></svg>
</div>
<div id="voiceMode">
  <button id="voiceExit">×</button>
  <div id="voiceOrb">
    <div class="orb-ring r1"></div><div class="orb-ring r2"></div><div class="orb-ring r3"></div>
    <div id="voiceFace">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="78" fill="rgba(0,0,0,0.4)" stroke="#fff" stroke-width="3"/>
        <g id="vEyeL"><ellipse cx="74" cy="86" rx="10" ry="13" fill="#fff"/><circle id="vPupilL" cx="74" cy="86" r="5" fill="#000"/></g>
        <g id="vEyeR"><ellipse cx="126" cy="86" rx="10" ry="13" fill="#fff"/><circle id="vPupilR" cx="126" cy="86" r="5" fill="#000"/></g>
        <path id="vMouth" d="M 78 128 Q 100 138 122 128" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
  </div>
  <div id="voiceText">Нажми микрофон и говори</div>
  <div id="voiceStatus">ГОТОВ</div>
  <button id="voiceTalkBtn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
</div>
<div id="app">
  <header>
    <div class="brand">WAVE · AI</div>
    <div class="hbtns">
      <button class="hbtn" id="chatListBtn">💬</button>
      <button class="hbtn" id="themeBtn">🎨</button>
      <button class="hbtn" id="helpBtn">?</button>
    </div>
  </header>
  <div id="faceWrap">
    <div id="face">

return null;}
function generateImage(prompt){if(isBadPrompt(prompt)){speak('Не могу это нарисовать.');return;}face.classList.add('spraying');face.classList.remove('talking','listening');statusEl.textContent='рисует';statusEl.className='thinking';addMsgToCur('user','[Нарисовать: '+prompt+']');dialogEl.innerHTML='<span class="wave">Wave</span>Рисую: '+escapeHtml(prompt)+'…';speak('Рисую '+prompt);setTimeout(function(){var url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt+', safe, family friendly')+'?width=768&height=768&nologo=true&seed='+Math.floor(Math.random()*1000000);resultImg.src=url;resultImg.onload=function(){face.classList.remove('spraying');imgBox.classList.add('show');statusEl.textContent='готов';statusEl.className='';addMsgToCur('assistant','[Картинка: '+prompt+']');};resultImg.onerror=function(){face.classList.remove('spraying');statusEl.textContent='ошибка';speak('Не удалось.');};},1200);}
function fallbackAnswer(text){var t=text.toLowerCase();if(t.indexOf('привет')>=0)return 'Привет! Как ты?';if(t.indexOf('как дела')>=0)return 'Отлично! А у тебя?';if(t.indexOf('кто ты')>=0)return 'Я Wave AI.';if(t.indexOf('пока')>=0)return 'Пока!';if(t.indexOf('спасибо')>=0)return 'Пожалуйста!';return 'Расскажи подробнее.';}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function processUserText(text){if(!text||!text.trim())return;text=text.trim();dialogEl.innerHTML='<span class="you">ты</span>'+escapeHtml(text);addMsgToCur('user',text);imgBox.classList.remove('show');var cmd=handleCommand(text);if(cmd==='__IMG__')return;if(cmd){sleep(120).then(function(){addMsgToCur('assistant',cmd);speak(cmd);});return;}statusEl.textContent='думает';statusEl.className='thinking';askAI(text).then(function(reply){addMsgToCur('assistant',reply);speak(reply);});}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var recognition=null,isListening=false,finalText='';
if(SR){recognition=new SR();recognition.lang='ru-RU';recognition.interimResults=true;recognition.continuous=false;
recognition.onstart=function(){isListening=true;face.classList.add('listening');talkBtn.classList.add('active','listening');statusEl.textContent='слушаю';statusEl.className='listening';finalText='';dialogEl.innerHTML='';};
recognition.onresult=function(e){var interim='',final='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}if(final)finalText+=final;dialogEl.innerHTML='<span class="you">ты</span>'+escapeHtml((finalText+' '+interim).trim());};
recognition.onerror=function(e){isListening=false;face.classList.remove('listening');talkBtn.classList.remove('active','listening');statusEl.textContent='готов';statusEl.className='';};
recognition.onend=function(){isListening=false;face.classList.remove('listening');talkBtn.classList.remove('active','listening');var t=finalText.trim();if(t)processUserText(t);else{statusEl.textContent='готов';statusEl.className='';}};}
var voiceContinuous=false,voiceRecognition=null,voiceIsListening=false,voiceFinalText='';
if(SR){voiceRecognition=new SR();voiceRecognition.lang='ru-RU';voiceRecognition.interimResults=true;voiceRecognition.continuous=false;
voiceRecognition.onstart=function(){voiceIsListening=true;voiceMode.classList.add('listening');voiceMode.classList.remove('speaking');voiceTalkBtn.classList.add('active','listening');voiceStatus.textContent='СЛУШАЮ';voiceStatus.className='listening';voiceText.textContent='…';voiceFinalText='';};
voiceRecognition.onresult=function(e){var interim='',final='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}if(final)voiceFinalText+=final;voiceText.textContent=(voiceFinalText+' '+interim).trim();};
voiceRecognition.onerror=function(e){voiceIsListening=false;voiceMode.classList.remove('listening');voiceTalkBtn.classList.remove('active','listening');voiceStatus.textContent='ОШИБКА';voiceStatus.className='';};
voiceRecognition.onend=function(){voiceIsListening=false;voiceMode.classList.remove('listening');voiceTalkBtn.classList.remove('active','listening');var t=voiceFinalText.trim();if(t){voiceProcessText(t);}else{voiceStatus.textContent='НЕ РАССЛЫШАЛ';if(voiceContinuous)setTimeout(function(){if(voiceContinuous&&!voiceIsListening)try{voiceRecognition.start();}catch(e){}},2000);}};}
function voiceProcessText(text){addMsgToCur('user',text);voiceStatus.textContent='ДУМАЕТ';voiceStatus.className='thinking';voiceText.textContent=text;var cmd=handleCommand(text);if(cmd==='__IMG__'){voiceText.textContent='Рисую…';setTimeout(function(){if(voiceContinuous&&!voiceIsListening)try{voiceRecognition.start();}catch(e){}},5000);return;}if(cmd){setTimeout(function(){addMsgToCur('assistant',cmd);voiceSpeak(cmd);},150);return;}askAI(text).then(function(reply){addMsgToCur('assistant',reply);voiceSpeak(reply);});}
function voiceSpeak(text){stopSpeak();voiceMode.classList.add('speaking');voiceMode.classList.remove('listening');voiceStatus.textContent='ГОВОРИТ';voiceStatus.className='speaking';voiceText.textContent=text;if(useNeural){try{var url='https://text.pollinations.ai/'+encodeURIComponent(text)+'?model=openai-audio&voice='+VOICE_NAME;var audio=new Audio(url);currentAudio=audio;audio.onended=function(){currentAudio=null;voiceMode.classList.remove('speaking');voiceStatus.textContent='ГОТОВ';voiceStatus.className='';if(voiceContinuous)setTimeout(function(){if(voiceContinuous&&!voiceIsListening)try{voiceRecognition.start();}catch(e){}},800);};audio.onerror=function(){useNeural=false;voiceSystemSpeak(text);};var p=audio.play();if(p&&p.catch)p.catch(function(){useNeural=false;voiceSystemSpeak(text);});return;}catch(e){useNeural=false;}}voiceSystemSpeak(text);}
function voiceSystemSpeak(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();}catch(e){}var u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=1.15;u.pitch=0.75;var voices=speechSynthesis.getVoices();var male=voices.find(function(v){return v.name&&(v.name.indexOf('Yuri')>=0||v.name.indexOf('Юрий')>=0);});var ru=male||voices.find(function(v){return v.lang==='ru-RU';})||voices.find(function(v){return v.lang&&v.lang.indexOf('ru')===0;});if(ru)u.voice=ru;u.onend=function(){voiceMode.classList.remove('speaking');voiceStatus.textContent='ГОТОВ';voiceStatus.className='';if(voiceContinuous)setTimeout(function(){if(voiceContinuous&&!voiceIsListening)try{voiceRecognition.start();}catch(e){}},800);};u.onerror=u.onend;speechSynthesis.speak(u);}
voiceTalkBtn.onclick=function(){initAudio();playClick();if(!SR){voiceText.textContent='Микрофон не поддерживается';return;}if(voiceIsListening){voiceRecognition.stop();return;}stopSpeak();voiceMode.classList.remove('speaking');voiceContinuous=true;try{voiceRecognition.start();}catch(e){}};
voiceExit.onclick=function(){initAudio();playClick();voiceContinuous=false;if(voiceIsListening&&voiceRecognition)voiceRecognition.stop();stopSpeak();voiceMode.classList.remove('show','listening','speaking');try{speechSynthesis.cancel();}catch(e){}};
talkBtn.onclick=function(){initAudio();playClick();if(!SR){speak('Нет микрофона.');return;}if(isListening){recognition.stop();return;}stopSpeak();face.classList.remove('talking','waving','spraying');try{recognition.start();}catch(e){}};
repeatBtn.onclick=function(){initAudio();playClick();if(lastSpokenText)speak(lastSpokenText);else speak('Нечего повторять.');};
chatSend.onclick=function(){var t=chatField.value.trim();if(!t)return;initAudio();playClick();chatField.value='';stopSpeak();processUserText(t);};
chatField.onkeydown=function(e){if(e.key==='Enter')chatSend.click();};
attachBtn.onclick=function(){initAudio();playClick();fileInput.click();};
fileInput.onchange=function(){var f=fileInput.files[0];if(!f)return;var reader=new FileReader();reader.onload=function(ev){attachedImg.src=ev.target.result;attached.classList.add('show');speak('Фото прикреплено.');};reader.readAsDataURL(f);};
removeAttach.onclick=function(){attached.classList.remove('show');attachedImg.src='';fileInput.value='';};
document.querySelectorAll('.qbtn').forEach(function(btn){btn.onclick=function(){initAudio();playClick();stopSpeak();processUserText(btn.dataset.say);};});
$('voiceModeOpen').onclick=function(){initAudio();playClick();stopSpeak();voiceMode.className='show bg-'+curTheme;voiceText.textContent='Нажми микрофон и говори';voiceStatus.textContent='ГОТОВ';voiceStatus.className='';voiceContinuous=false;speak('Голосовой режим.');};
chatListBtn.onclick=function(){initAudio();playClick();updateChatList();chatsPanel.classList.add('show');};
chatsClose.onclick=function(){initAudio();playClick();chatsPanel.classList.remove('show');};
newChatBtn.onclick=function(){initAudio();playClick();newChat();chatsPanel.classList.remove('show');speak('Новый чат.');};
themeBtn.onclick=function(){initAudio();playClick();buildThemeList();themePanel.classList.add('show');};
themeClose.onclick=function(){initAudio();playClick();themePanel.classList.remove('show');};
helpBtn.onclick=function(){initAudio();playClick();helpPanel.classList.add('show');};
helpClose.onclick=function(){initAudio();playClick();helpPanel.classList.remove('show');};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function blink(){face.classList.add('blink');setTimeout(function(){face.classList.remove('blink');},120);setTimeout(blink,2500+Math.random()*3500);}
setTimeout(blink,2000);
function startGreeting(){face.classList.add('waving');setTimeout(function(){face.classList.remove('waving');},2500);var g;if(DEVICE_DATA.visits>1)g='С возвращением!';else g='Привет! Я Wave AI.';addMsgToCur('assistant',g);speak(g);}
document.body.addEventListener('touchstart',function(){initAudio();},{once:true});
document.body.addEventListener('click',function(){initAudio();},{once:true});
</script>
</body>
