<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Говорящая рисовалка</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
    background: #111;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #fff;
    touch-action: none;
  }
  #ui {
    position: fixed;
    bottom: 12px; left: 12px; right: 12px;
    display: flex; gap: 8px;
    z-index: 10;
  }
  button, input {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background: #222; color: #fff;
    border: 1px solid #444;
  }
  button:active { background: #444; }
  input { flex: 2; background: #fff; color: #000; }
  #status {
    position: fixed; top: 10px; left: 10px;
    color: #999; font-size: 13px;
    background: rgba(0,0,0,0.5);
    padding: 6px 10px; border-radius: 8px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">Нарисуй что-нибудь…</div>
<div id="ui">
  <input id="text" placeholder="Или напиши слово и нажми Озвучить" />
  <button id="speak">🔊 Озвучить</button>
  <button id="clear">🧹 Очистить</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const textInput = document.getElementById('text');

let drawing = false;
let strokes = [];        // массив линий: [{points:[{x,y}...]}, ...]
let currentStroke = null;

// --- Озвучка ---
function speak(text) {
  if (!text) return;
  if (!('speechSynthesis' in window)) {
    statusEl.textContent = 'Синтез речи не поддерживается';
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = 1;
  u.pitch = 1;
  window.speechSynthesis.speak(u);
  statusEl.textContent = '🔊 ' + text;
}

// --- Анализ рисунка ---
// Очень простой «распознаватель»: смотрит на форму штрихов
// и угадывает, что ты нарисовал. Без нейросети, но забавно.
function analyzeDrawing() {
  if (strokes.length === 0) return 'пусто';
  if (strokes.length === 1) {
    const s = strokes[0];
    const pts = s.points;
    if (pts.length < 5) return 'точка';
    // bounding box
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for (const p of pts) {
      if (p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if (p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    }
    const w = maxX-minX, h = maxY-minY;
    const ratio = w / (h || 1);

    // длина и «извилистость»
    let len = 0;
    for (let i=1;i<pts.length;i++){
      len += Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    }
    const straightness = len / (Math.hypot(maxX-minX, maxY-minY) || 1);
    const closed = Math.hypot(pts[0].x-pts[pts.length-1].x, pts[0].y-pts[pts.length-1].y) < Math.min(w,h)*0.4;

    if (closed && ratio > 0.7 && ratio < 1.4) return 'круг или что-то круглое';
    if (straightness < 1.2) return 'линия';
    if (ratio > 2.5) return 'что-то длинное и горизонтальное';
    if (ratio < 0.4) return 'что-то длинное и вертикальное';
    return 'закорючка';
  }
  // несколько штрихов
  if (strokes.length >= 2 && strokes.length <= 4) return 'несколько линий, похоже на букву или фигуру';
  return 'сложный рисунок, много линий';
}

// --- Рисование ---
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redraw();
}

function redraw() {
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const s of strokes) {
    if (s.points.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for (let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
  }
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  currentStroke = { points: [pos(e)] };
  strokes.push(currentStroke);
  redraw();
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  currentStroke.points.push(pos(e));
  redraw();
}
function end(e) {
  if (!drawing) return;
  drawing = false;
  // После каждой линии — озвучиваем, что получилось
  const desc = analyzeDrawing();
  speak(desc);
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
canvas.addEventListener('mouseup', end);
canvas.addEventListener('mouseleave', end);

canvas.addEventListener('touchstart', start, {passive:false});
canvas.addEventListener('touchmove', move, {passive:false});
canvas.addEventListener('touchend', end);
canvas.addEventListener('touchcancel', end);

// --- Кнопки ---
document.getElementById('speak').onclick = () => {
  const t = textInput.value.trim();
  if (t) speak(t);
  else speak(analyzeDrawing());
};
document.getElementById('clear').onclick = () => {
  strokes = [];
  currentStroke = null;
  redraw();
  statusEl.textContent = 'Очищено';
};

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
