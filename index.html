<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;overflow:hidden;font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;background:var(--bg1);color:var(--tx);
  transition:background .5s,color .5s}
:root{--bg1:#06060f;--bg2:#0f0e26;--bg3:#1a1838;--tx:#f2f2f8;--gr:#9a9ab0;
  --ln:#2e2b78;--ac:#a78bfa;--glass:rgba(30,30,60,.55);
  --danger:#ef4444;--ok:#22c55e;--warn:#f59e0b}

body.wv-moon{--bg1:#06060f;--bg2:#0f0e26;--bg3:#1a1838;--tx:#f2f2f8;--gr:#9a9ab0;--ln:#2e2b78;--ac:#a78bfa;--glass:rgba(30,30,60,.55)}
body.wv-aurora{--bg1:#071022;--bg2:#0d1c38;--bg3:#14304d;--tx:#e0f2ff;--gr:#7a9ab0;--ln:#2b4a78;--ac:#22d3ee;--glass:rgba(20,50,80,.55)}
body.wv-neon{--bg1:#0d0221;--bg2:#1a0533;--bg3:#2a0a4a;--tx:#f0e6ff;--gr:#a080c0;--ln:#5a1a80;--ac:#ff00aa;--glass:rgba(60,0,80,.5)}
body.wv-matrix{--bg1:#000a00;--bg2:#001500;--bg3:#002200;--tx:#00ff41;--gr:#008822;--ln:#005511;--ac:#00ff41;--glass:rgba(0,40,0,.6)}
body.wv-sakura{--bg1:#fef4f8;--bg2:#fae0ee;--bg3:#f5c8dc;--tx:#2c0a1a;--gr:#8a4a6a;--ln:#f0c0d8;--ac:#ec4899;--glass:rgba(255,255,255,.75)}
body.wv-phoenix{--bg1:#fdf2e8;--bg2:#fadcb8;--bg3:#f5c890;--tx:#3c0e00;--gr:#8a3a10;--ln:#f0b080;--ac:#dc2626;--glass:rgba(255,255,255,.55)}
body.wv-whale{--bg1:#eef4fa;--bg2:#d8e6f3;--bg3:#c0d8ea;--tx:#04182c;--gr:#3a5878;--ln:#b0d0ea;--ac:#1e40af;--glass:rgba(255,255,255,.65)}
body.wv-penguin{--bg1:#f4f8fb;--bg2:#dfeaf3;--bg3:#c8dcec;--tx:#08182c;--gr:#4a607a;--ln:#c0d8ea;--ac:#0ea5e9;--glass:rgba(255,255,255,.75)}
body.wv-owl{--bg1:#f2f0fa;--bg2:#e0ddf0;--bg3:#c8c4e0;--tx:#100a2c;--gr:#5a507a;--ln:#c8c0e0;--ac:#7c3aed;--glass:rgba(255,255,255,.75)}
body.wv-fox{--bg1:#fef4e8;--bg2:#fbe0c0;--bg3:#f5c890;--tx:#2c1400;--gr:#8a5010;--ln:#f0c898;--ac:#ea580c;--glass:rgba(255,255,255,.6)}
body.wv-cat{--bg1:#fdf6fa;--bg2:#fae4ef;--bg3:#f5c8dc;--tx:#2c0a1e;--gr:#8a506a;--ln:#f0c0d8;--ac:#db2777;--glass:rgba(255,255,255,.75)}
body.wv-wave{--bg1:#f2f8fd;--bg2:#e0eef9;--bg3:#c8ddec;--tx:#082030;--gr:#5a7285;--ln:#c8dded;--ac:#0077cc;--glass:rgba(255,255,255,.7)}
body.wv-lion{--bg1:#fdf6ec;--bg2:#fae6ca;--bg3:#f0d0a0;--tx:#2c1808;--gr:#8a6030;--ln:#f0d5a8;--ac:#e0620a;--glass:rgba(255,255,255,.6)}
body.wv-croc{--bg1:#f2faf2;--bg2:#dff2df;--bg3:#c0e0c0;--tx:#0a200a;--gr:#4a704a;--ln:#c5e5c5;--ac:#137a2c;--glass:rgba(255,255,255,.75)}
body.wv-dragon{--bg1:#fdf2f2;--bg2:#fadcdc;--bg3:#f0b8b8;--tx:#2c0808;--gr:#8a4a4a;--ln:#f0b5b5;--ac:#d81f1f;--glass:rgba(255,255,255,.6)}
body.wv-panda{--bg1:#fbfbfb;--bg2:#eaeaea;--bg3:#d0d0d0;--tx:#151515;--gr:#6e6e6e;--ln:#d5d5d5;--ac:#3a3a3a;--glass:rgba(255,255,255,.85)}
body.wv-tiger{--bg1:#fdf4e8;--bg2:#fae0bc;--bg3:#f0c898;--tx:#2c1200;--gr:#8a5420;--ln:#f0c898;--ac:#e0620a;--glass:rgba(255,255,255,.6)}
body.wv-frog{--bg1:#f3faf5;--bg2:#ddf1e3;--bg3:#c0e0c8;--tx:#082015;--gr:#486e55;--ln:#bfe2cb;--ac:#0a8f5e;--glass:rgba(255,255,255,.75)}
body.wv-wolf{--bg1:#f6f6f6;--bg2:#e8e8e8;--bg3:#cccccc;--tx:#181818;--gr:#6e6e6e;--ln:#d5d5d5;--ac:#4a4a4a;--glass:rgba(255,255,255,.85)}
body.wv-shark{--bg1:#eef7fc;--bg2:#d4eaf6;--bg3:#b0d5ea;--tx:#081e2c;--gr:#4a6a80;--ln:#b5d9ee;--ac:#0369a1;--glass:rgba(255,255,255,.75)}
body.wv-bee{--bg1:#fefbf0;--bg2:#fbeecb;--bg3:#f0d8a0;--tx:#1a1400;--gr:#7a6018;--ln:#f0d8a0;--ac:#b8840a;--glass:rgba(255,255,255,.75)}

#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene canvas{width:100%;height:100%;display:block}
#root{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh}

#bar{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;flex-shrink:0}
.nb{width:40px;height:40px;border-radius:50%;flex-shrink:0;cursor:pointer;
  background:var(--glass);border:1.5px solid var(--ln);color:var(--tx);font-size:18px;
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);
  transition:transform .15s}
.nb:active{transform:scale(.9)}
.nb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
#brand{flex:1;min-width:0;text-align:center;cursor:pointer;font-size:18px;
  font-weight:700;letter-spacing:.5px;overflow:hidden}
#brand small{display:block;font-size:10px;margin-top:1px;color:var(--gr);
  font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
#brand small .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--ok);margin-right:5px;vertical-align:middle;animation:pl 2s infinite}
#brand small .dot.off{background:var(--danger)}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.3}}

#crystals{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;
  z-index:50;padding:6px 12px;border-radius:20px;background:var(--glass);
  border:1.5px solid var(--ln);backdrop-filter:blur(12px);
  font-size:12px;font-weight:700;color:var(--tx);display:flex;align-items:center;
  gap:5px;cursor:pointer}
#crystals:active{transform:scale(.95)}

#flow{flex:1;overflow-y:auto;padding:12px 16px 16px;display:flex;
  flex-direction:column;gap:12px;scroll-behavior:smooth}
#flow::-webkit-scrollbar{width:0}
.bub{position:relative;max-width:88%;padding:11px 15px;border-radius:20px;
  font-size:15.5px;line-height:1.55;word-wrap:break-word;color:var(--tx);
  backdrop-filter:blur(14px);border:1px solid rgba(128,128,128,.15);
  animation:bi .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes bi{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.bub.me{align-self:flex-end;background:var(--ac);color:#fff;
  border-bottom-right-radius:5px;border-color:transparent}
.bub.ai{align-self:flex-start;background:var(--glass);border-bottom-left-radius:5px}
.bub-head{display:flex;justify-content:space-between;align-items:center;
  margin-bottom:5px;font-size:10.5px;letter-spacing:1.4px;font-weight:800;
  color:var(--ac);text-transform:uppercase}
.bub.me .bub-head{color:rgba(255,255,255,.75)}
.bub-copy{background:none;border:none;color:inherit;cursor:pointer;font-size:12px;
  opacity:.6;padding:2px 4px}
.bub code{background:rgba(128,128,128,.25);padding:1px 5px;border-radius:5px;
  font-family:'JetBrains Mono',monospace;font-size:13.5px}
.bub pre{background:rgba(0,0,0,.35);padding:10px 12px;border-radius:10px;
  overflow-x:auto;margin:7px 0;font-family:'JetBrains Mono',monospace;
  font-size:12.5px;white-space:pre-wrap;line-height:1.5}
.bub img{max-width:100%;border-radius:12px;display:block;margin-top:6px}
.caret{display:inline-block;width:2px;height:1em;background:var(--ac);
  vertical-align:text-bottom;margin-left:2px;animation:ck .8s infinite}
@keyframes ck{0%,50%{opacity:1}51%,100%{opacity:0}}
.err{color:var(--danger);font-weight:600}

.wait{padding:14px 18px}
.wait .d{display:flex;gap:5px;margin-top:5px}
.wait .d span{width:7px;height:7px;border-radius:50%;background:var(--ac);
  animation:bn 1.2s infinite}
.wait .d span:nth-child(2){animation-delay:.15s}
.wait .d span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-7px);opacity:1}}

.void{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:16px}
.void .orb{width:88px;height:88px;border-radius:26px;display:flex;align-items:center;
  justify-content:center;font-size:46px;background:linear-gradient(135deg,var(--ac),#39CCCC);
  box-shadow:0 12px 40px rgba(139,92,246,.5);animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
.void .vt{font-size:20px;font-weight:700;text-align:center}
.void .vs{font-size:13px;color:var(--gr);text-align:center;max-width:82%;line-height:1.5}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;max-width:440px;margin-top:6px}
.chip{padding:11px;border-radius:13px;cursor:pointer;background:var(--glass);
  border:1px solid var(--ln);color:var(--tx);font-family:inherit;font-size:12px;
  text-align:left;line-height:1.35;backdrop-filter:blur(10px);transition:transform .15s}
.chip:active{transform:scale(.95)}
.chip .ce{font-size:16px;display:block;margin-bottom:3px}

#dock{padding:6px 14px calc(env(safe-area-inset-bottom,0px) + 12px);flex-shrink:0}
#att{display:none;align-items:center;gap:10px;background:var(--bg2);padding:7px 11px;
  border-radius:14px;margin-bottom:7px;border:1px solid var(--ln)}
#att img{width:40px;height:40px;border-radius:9px;object-fit:cover}
#att .an{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#att .ax{background:none;border:none;color:var(--danger);font-size:19px;cursor:pointer;
  padding:0 6px;font-family:inherit}
#entry{display:flex;align-items:center;gap:7px;padding:5px 5px 5px 12px;border-radius:28px;
  background:var(--glass);border:1.5px solid var(--ln);backdrop-filter:blur(24px);
  box-shadow:0 6px 24px rgba(0,0,0,.1)}
#input{flex:1;background:none;border:none;outline:none;color:var(--tx);font-size:16px;
  font-family:inherit;padding:8px 0;min-width:0}
#input::placeholder{color:var(--gr)}
.big{width:38px;height:38px;border-radius:50%;background:none;border:none;color:var(--gr);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:transform .15s,background .2s}
.big:active{transform:scale(.85);background:rgba(128,128,128,.15)}
.big svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.big.mic{color:var(--ac)}
#go{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--ac);border:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .15s}
#go:active{transform:scale(.85)}
#go:disabled{opacity:.4;cursor:not-allowed}
#go svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:200;background:var(--bg1);display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 58px) 18px 24px;
  overflow-y:auto}
.sheet.on{display:flex;animation:si .3s ease}
@keyframes si{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sheet h2{font-size:23px;margin-bottom:16px;font-weight:800}
.sheet h2.sub{font-size:17px;margin-top:22px;margin-bottom:10px;opacity:.7}
.shx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:18px;
  width:40px;height:40px;border-radius:50%;background:var(--bg2);border:1px solid var(--ln);
  color:var(--tx);font-size:19px;cursor:pointer;font-family:inherit}
#list{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.row{padding:12px 14px;border-radius:16px;background:var(--bg2);display:flex;
  justify-content:space-between;align-items:center;gap:8px;cursor:pointer;
  transition:transform .15s}
.row:active{transform:scale(.98)}
.row.on{background:var(--ac);color:#fff}
.row .info{flex:1;min-width:0}
.row .ti{font-size:14.5px;font-weight:600;margin-bottom:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row .me{font-size:10.5px;opacity:.7}
.row .rm{width:30px;height:30px;border-radius:50%;background:rgba(239,68,68,.15);
  border:none;color:var(--danger);font-size:14px;cursor:pointer;
  font-family:inherit;flex-shrink:0}
.btn{padding:14px;border-radius:16px;margin-top:9px;width:100%;background:var(--ac);
  border:none;color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--bg2);color:var(--tx);border:1px solid var(--ln)}
.btn.danger{background:var(--danger)}
.search{width:100%;padding:12px 14px;border-radius:14px;margin-top:10px;background:var(--bg2);
  border:1px solid var(--ln);color:var(--tx);font-family:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--ac)}
#palette{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.swatch{padding:14px 10px;border-radius:18px;cursor:pointer;text-align:center;
  background:var(--bg2);border:2px solid transparent;color:var(--tx);
  font-family:inherit;transition:transform .15s,border-color .2s}
.swatch:active{transform:scale(.94)}
.swatch.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac)22}
.swatch .se{font-size:30px;display:block;margin-bottom:5px}
.swatch .sn{font-size:12.5px;font-weight:600}
#models{display:flex;flex-direction:column;gap:9px}
.card{padding:14px;border-radius:16px;cursor:pointer;background:var(--bg2);
  border:2px solid transparent;color:var(--tx);font-family:inherit;display:flex;
  justify-content:space-between;align-items:center;gap:10px;transition:transform .15s}
.card:active{transform:scale(.98)}
.card.on{border-color:var(--ac);background:var(--glass)}
.card .ci{flex:1;min-width:0;text-align:left}
.card .cn{font-size:14.5px;font-weight:700;margin-bottom:2px}
.card .cs{font-size:11px;color:var(--gr)}
.card .cb{font-size:9.5px;padding:3px 8px;border-radius:7px;background:var(--ac);
  color:#fff;font-weight:800;flex-shrink:0;letter-spacing:.5px}

.modal{position:fixed;inset:0;z-index:1100;background:rgba(0,0,0,.75);
  backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;
  padding:24px}
.modal.on{display:flex}
.mbox{background:rgba(30,30,42,.98);border:1px solid rgba(255,255,255,.15);
  border-radius:28px;padding:28px 24px 20px;max-width:360px;width:100%;text-align:center;
  animation:mi .4s cubic-bezier(.34,1.56,.64,1);color:#fff}
@keyframes mi{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
.mico{width:78px;height:78px;border-radius:22px;
  background:linear-gradient(135deg,#8b5cf6,#39CCCC);display:flex;align-items:center;
  justify-content:center;font-size:42px;margin:0 auto 14px}
.mtit{font-size:19px;font-weight:700;margin-bottom:6px}
.msub2{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:18px}
.mtxt{font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.75);margin-bottom:22px}
.mbtns{display:flex;gap:9px}
.mbtn{flex:1;padding:13px;border-radius:14px;border:none;font-size:14.5px;
  font-weight:700;cursor:pointer;font-family:inherit}
.mbtn.c{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.mbtn.o{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}
.minput{width:100%;padding:14px;border-radius:14px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);color:#fff;font-size:15px;
  font-family:inherit;outline:none;margin-bottom:10px}
.minput.code{font-size:22px;letter-spacing:8px;text-align:center;
  font-family:'JetBrains Mono',monospace}
.mmsg{margin-top:12px;font-size:13px;min-height:18px}

#term{position:fixed;inset:0;z-index:900;background:#000;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 14px;
  font-family:'JetBrains Mono',monospace;color:#00ff41;font-size:13px;overflow:hidden}
#term.on{display:flex}
#termBar{display:flex;justify-content:space-between;align-items:center;
  padding-bottom:10px;border-bottom:1px solid #00ff4133;margin-bottom:10px;flex-shrink:0}
#termBar .dots{display:flex;gap:6px}
#termBar .dots span{width:11px;height:11px;border-radius:50%}
#termBar .dots span:nth-child(1){background:#ff5f57}
#termBar .dots span:nth-child(2){background:#febc2e}
#termBar .dots span:nth-child(3){background:#28c840}
#termBar .ti{color:#00ff4188;font-size:11px;letter-spacing:1.5px}
#termLog{flex:1;overflow-y:auto;line-height:1.65;padding-right:6px}
#termLog::-webkit-scrollbar{width:4px}
#termLog::-webkit-scrollbar-thumb{background:#00ff4166;border-radius:2px}
#termLog .li{word-break:break-word}
#termLog .p{color:#a78bfa;margin-right:8px}
#termLog .ok{color:#22c55e}
#termLog .er{color:#ef4444}
#termLog .in{color:#60a5fa}
#termLog .dm{color:#00ff4166}
#termIn{display:flex;gap:8px;padding-top:10px;border-top:1px solid #00ff4133;
  flex-shrink:0;align-items:center}
#termIn .p{color:#a78bfa}
#termIn input{flex:1;background:none;border:none;outline:none;color:#00ff41;
  font-family:inherit;font-size:13px;caret-color:#00ff41}

#voice{position:fixed;inset:0;z-index:800;background:var(--bg1);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 40px}
#voice.on{display:flex}
#halo{width:min(68vw,270px);height:min(68vw,270px);position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:26px}
.hr{position:absolute;border-radius:50%;border:2px solid var(--ac);opacity:.3}
.hr.h1{inset:0;animation:hp 3s ease-in-out infinite}
.hr.h2{inset:-14px;animation:hp 3s ease-in-out infinite .5s;opacity:.2}
.hr.h3{inset:-28px;animation:hp 3s ease-in-out infinite 1s;opacity:.1}
@keyframes hp{0%,100%{transform:scale(1)}50%{transform:scale(1.08);opacity:.12}}
#face{width:66%;height:66%;border-radius:50%;background:var(--bg2);display:flex;
  align-items:center;justify-content:center;font-size:76px}
#vt{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px;max-width:90%}

<script>
(() => {
'use strict';

const S = window.WAVE_SECRETS || {};
const APP = {
  user: null, chats: [], current: null, memory: [],
  backend: 'deepseek', theme: 'moon', attached: null,
  working: false, rec: null, hearing: false, heard: ''
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function md(t){
  if(!t) return '';
  let s = esc(t);
  s = s.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s;
}

function vibrate(k='light'){
  if(!navigator.vibrate) return;
  try{ navigator.vibrate({light:10,medium:20,heavy:[30,20,30],ok:[10,30,10],err:[50,30,50]}[k]||10); }catch(_){}
}

let tipTimer;
function note(m){
  const t = $('tip');
  t.textContent = m;
  t.classList.add('on');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ================= АККАУНТЫ ================= */
function getUsers(){ try{ return JSON.parse(localStorage.getItem('wv_users')||'{}'); }catch{ return {}; } }
function saveUsers(u){ try{ localStorage.setItem('wv_users', JSON.stringify(u)); }catch{} }
function me(){ const e = localStorage.getItem('wv_user'); if(!e) return null; return getUsers()[e] || null; }
function saveMe(u){ const e = localStorage.getItem('wv_user'); if(!e) return; const all=getUsers(); all[e]=u; saveUsers(all); APP.user=u; }

function genCode(){ return String(Math.floor(100000 + Math.random()*900000)); }

async function sendMail(to, code){
  const pub = S.emailjsPublic, svc = S.emailjsService, tpl = S.emailjsTemplate;
  if(!pub || pub.startsWith('__')){
    alert('EmailJS не настроен. Код: '+code+'\n\n(в рабочей версии код придёт на почту)');
    return false;
  }
  try{
    emailjs.init(pub);
    await emailjs.send(svc, tpl, { to_email: to, code: code, email: to });
    return true;
  }catch(e){
    alert('Не удалось отправить письмо: '+e.message+'\n\nВаш код: '+code);
    return false;
  }
}

async function requestCode(email, mode){
  const users = getUsers();
  if(mode==='login' && !users[email]) throw new Error('Аккаунт не найден. Зарегистрируйтесь.');
  if(mode==='signup' && users[email]) throw new Error('Email уже занят. Войдите.');
  const code = genCode();
  const ttl = (S.codeTTLmin || 10) * 60 * 1000;
  sessionStorage.setItem('wv_pending', JSON.stringify({email, code, mode, exp: Date.now()+ttl}));
  await sendMail(email, code);
  return code;
}

function verify(input){
  const raw = sessionStorage.getItem('wv_pending');
  if(!raw) throw new Error('Код не запрошен');
  const p = JSON.parse(raw);
  if(Date.now() > p.exp) throw new Error('Код истёк');
  if(String(input).trim() !== String(p.code)) throw new Error('Неверный код');
  const users = getUsers();
  if(!users[p.email]){
    users[p.email] = {
      email: p.email, name: p.email.split('@')[0], avatar: '🌙',
      created: Date.now(), crystals: S.crystalsOnSignup || 100,
      lastDaily: Date.now(), messages: 0
    };
  }
  users[p.email].lastLogin = Date.now();
  saveUsers(users);
  sessionStorage.removeItem('wv_pending');
  localStorage.setItem('wv_user', p.email);
  APP.user = users[p.email];
  return APP.user;
}

/* ================= UI АККАУНТА ================= */
function openAuth(mode='login'){
  const m = document.createElement('div');
  m.className = 'modal on';
  m.innerHTML = `
    <div class="mbox">
      <div class="mico">🔐</div>
      <div class="mtit">${mode==='login'?'Вход в Wave':'Регистрация'}</div>
      <div class="msub2">Код придёт на почту</div>
      <input class="minput" id="aEmail" type="email" placeholder="твой@gmail.com">
      <input class="minput code" id="aCode" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="display:none">
      <button class="mbtn o" id="aSend" style="width:100%;margin-bottom:8px">${mode==='login'?'Получить код':'Создать'}</button>
      <button class="mbtn c" id="aSwap" style="width:100%">${mode==='login'?'Нет аккаунта? →':'Уже есть? Войти'}</button>
      <button class="mbtn c" id="aClose" style="width:100%;margin-top:8px">Отмена</button>
      <div class="mmsg" id="aMsg"></div>
    </div>`;
  document.body.appendChild(m);

  const emailI = m.querySelector('#aEmail');
  const codeI = m.querySelector('#aCode');
  const send = m.querySelector('#aSend');
  const swap = m.querySelector('#aSwap');
  const close = m.querySelector('#aClose');
  const msg = m.querySelector('#aMsg');
  let step = 'email';

  send.onclick = async () => {
    msg.textContent = '';
    if(step==='email'){
      const email = emailI.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ msg.style.color='#f87171'; msg.textContent='Введи корректный email'; return; }
      send.disabled = true; send.textContent='Отправляем…';
      try{
        await requestCode(email, mode);
        step='code';
        emailI.disabled = true;
        codeI.style.display='block';
        codeI.focus();
        send.textContent='Войти';
        msg.style.color='#4ade80';
        msg.textContent='Код отправлен на '+email;
      }catch(e){
        msg.style.color='#f87171';
        msg.textContent=e.message;
        send.textContent = mode==='login'?'Получить код':'Создать';
      }finally{ send.disabled=false; }
    } else {
      try{
        verify(codeI.value);
        msg.style.color='#4ade80'; msg.textContent='Успех!';
        vibrate('ok');
        setTimeout(() => { m.remove(); refreshUserUI(); redrawFlow(); }, 500);
      }catch(e){
        msg.style.color='#f87171'; msg.textContent=e.message;
      }
    }
  };
  swap.onclick = () => { m.remove(); openAuth(mode==='login'?'signup':'login'); };
  close.onclick = () => m.remove();
  emailI.focus();
}

function refreshUserUI(){
  const u = me();
  APP.user = u;
  const isAuth = !!u;
  $('loginBtn').style.display = isAuth ? 'none' : 'block';
  $('profileBtn').style.display = isAuth ? 'block' : 'none';
  $('logoutBtn').style.display = isAuth ? 'block' : 'none';
  $('userTitle').textContent = isAuth ? (u.name || u.email) : 'Гость';
  if(isAuth){
    $('crystals').style.display = 'flex';
    updateCrystalUI();
  } else {
    $('crystals').style.display = 'none';
  }
}

function dailyCheck(){
  const u = me(); if(!u) return;
  const now = new Date();
  const last = new Date(u.lastDaily || 0);
  if(last.toDateString() !== now.toDateString()){
    u.crystals = S.crystalsPerDay || 50;
    u.lastDaily = Date.now();
    saveMe(u);
    note('💎 +'+(S.crystalsPerDay||50)+' кристаллов за день!');
  }
}
function updateCrystalUI(){
  const u = me(); if(!u) return;
  $('crCount').textContent = u.crystals || 0;
}
function spendCrystal(){
  const u = me(); if(!u) return true;
  if((u.crystals||0) <= 0){
    note('💎 Кристаллы кончились. Приходи завтра!');
    return false;
  }
  u.crystals--;
  saveMe(u);
  updateCrystalUI();
  return true;
}

/* ================= ТЕМЫ ================= */
const THEMES = {
  moon:['🌙','Луна'], aurora:['🌌','Сияние'], neon:['💜','Неон'],
  matrix:['💚','Матрица'], sakura:['🌸','Сакура'], phoenix:['🔥','Феникс'],
  whale:['🐳','Кит'], penguin:['🐧','Пингвин'], owl:['🦉','Сова'],
  fox:['🦊','Лиса'], cat:['🐱','Кот'], wave:['🌊','Волна'],
  lion:['🦁','Лев'], croc:['🐊','Крокодил'], dragon:['🐉','Дракон'],
  panda:['🐼','Панда'], tiger:['🐯','Тигр'], frog:['🐸','Жаба'],
  wolf:['🐺','Волк'], shark:['🦈','Акула'], bee:['🐝','Пчела']
};

function setTheme(k){
  if(!THEMES[k]) k='moon';
  APP.theme=k;
  document.body.className = 'wv-'+k;
  try{ localStorage.setItem('wv_theme', k); }catch{}
  $('face').textContent = THEMES[k][0];
  startFx(k);
  buildPalette();
}
function buildPalette(){
  const w = $('palette'); w.innerHTML='';
  for(const k in THEMES){
    const b = document.createElement('button');
    b.className = 'swatch'+(k===APP.theme?' on':'');
    b.innerHTML = `<span class="se">${THEMES[k][0]}</span><span class="sn">${THEMES[k][1]}</span>`;
    b.onclick = () => { vibrate('medium'); setTheme(k); };
    w.appendChild(b);
  }
}

/* ================= АНИМАЦИЯ ФОНА ================= */
let fxRAF = null, fxTheme = 'moon';
function startFx(theme){
  fxTheme = theme;
  if(fxRAF) cancelAnimationFrame(fxRAF);
  const cv = $('fx'); const ctx = cv.getContext('2d');
  function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  const stars = Array.from({length: 80}, () => ({
    x:Math.random(), y:Math.random()*0.7, s:1+Math.random()*2,
    t:Math.random()*Math.PI*2
  }));
  const snow = Array.from({length: 60}, () => ({
    x:Math.random(), y:Math.random(), v:0.0005+Math.random()*0.0015,
    s:1+Math.random()*2, a:Math.random()*Math.PI*2
  }));
  const petals = Array.from({length: 40}, () => ({
    x:Math.random(), y:Math.random(), v:0.0008+Math.random()*0.0012,
    s:3+Math.random()*4, a:Math.random()*Math.PI*2, rot:0
  }));
  const bubbles = Array.from({length: 35}, () => ({
    x:Math.random(), y:1+Math.random(), v:0.001+Math.random()*0.002,
    s:3+Math.random()*8
  }));
  const matrixCols = Math.floor(innerWidth/14);
  const matrixDrops = Array.from({length:matrixCols}, () => Math.random()*innerHeight);

  let t = 0;
  function frame(){
    t++;
    ctx.clearRect(0,0,cv.width,cv.height);
    const dark = ['moon','aurora','neon','matrix'].includes(fxTheme);

    if(fxTheme==='moon'){
      ctx.fillStyle='rgba(255,255,255,.9)';
      stars.forEach(s => {
        const a = 0.3 + 0.7*Math.abs(Math.sin(s.t + t*0.02));
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(s.x*cv.width, s.y*cv.height, s.s, 0, 7); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    if(fxTheme==='aurora'){
      for(let i=0;i<4;i++){
        const g = ctx.createLinearGradient(0, 0, cv.width, cv.height*0.6);
        const hue = (t*0.3 + i*60) % 360;
        g.addColorStop(0, `hsla(${hue},80%,55%,0.15)`);
        g.addColorStop(0.5, `hsla(${hue+40},80%,60%,0.25)`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(0, i*80 + Math.sin(t*0.02+i)*30, cv.width, 200);
      }
    }

    if(fxTheme==='neon'){
      ctx.strokeStyle = 'rgba(255,0,170,.3)';
      ctx.lineWidth = 1;
      for(let i=0;i<12;i++){
        ctx.beginPath();
        const x0 = (i*97 + t*0.5) % cv.width;
        ctx.moveTo(x0, 0);
        ctx.lineTo(x0 + Math.sin(t*0.01+i)*50, cv.height);
        ctx.stroke();
      }
    }

    if(fxTheme==='matrix'){
      ctx.font = '14px monospace';
      for(let i=0;i<matrixDrops.length;i++){
        const x = i*14;
        const y = matrixDrops[i];
        const c = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ01'[Math.floor(Math.random()*28)];
        ctx.fillStyle = 'rgba(0,255,65,.8)';
        ctx.fillText(c, x, y);
        ctx.fillStyle = 'rgba(0,255,65,.15)';
        ctx.fillText(c, x, y-16);
        matrixDrops[i] += 4;
        if(matrixDrops[i] > cv.height && Math.random() > 0.985) matrixDrops[i] = 0;
      }
    }

    if(fxTheme==='sakura' || fxTheme==='phoenix'){
      petals.forEach(p => {
        p.y += p.v; p.a += 0.02;
        p.x += Math.sin(p.a)*0.001;
        if(p.y > 1.1){ p.y=-0.1; p.x=Math.random(); }
        ctx.save();
        ctx.translate(p.x*cv.width, p.y*cv.height);
        ctx.rotate(p.a);
        ctx.fillStyle = fxTheme==='sakura' ? 'rgba(255,183,206,.7)' : 'rgba(255,140,60,.65)';
        ctx.beginPath();
        ctx.ellipse(0,0,p.s,p.s*0.6,0,0,7);
        ctx.fill();
        ctx.restore();
      });
    }

    if(fxTheme==='whale' || fxTheme==='shark' || fxTheme==='wave'){
      bubbles.forEach(b => {
        b.y -= b.v;
        if(b.y < -0.05){ b.y=1.1; b.x=Math.random(); }
        ctx.strokeStyle = 'rgba(200,230,255,.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(b.x*cv.width, b.y*cv.height, b.s, 0, 7);
        ctx.stroke();
      });
    }

    if(fxTheme==='penguin' || fxTheme==='wolf'){
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      snow.forEach(s => {
        s.y += s.v; s.a += 0.01;
        s.x += Math.sin(s.a)*0.0008;
        if(s.y > 1.05){ s.y=-0.05; s.x=Math.random(); }
        ctx.beginPath(); ctx.arc(s.x*cv.width, s.y*cv.height, s.s, 0, 7); ctx.fill();
      });
    }

    if(dark && fxTheme==='moon'){
      stars.forEach(s => {
        if(Math.random() > 0.9975){
          ctx.strokeStyle = 'rgba(255,255,255,.9)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(s.x*cv.width, s.y*cv.height);
          ctx.lineTo(s.x*cv.width-60, s.y*cv.height+30);
          ctx.stroke();
        }
      });
    }

    fxRAF = requestAnimationFrame(frame);
  }
  frame();
}

function redrawFlow(){

function pourInk(full){
  const c = cur(); if(!c) return;
  c.messages.push({role:'assistant', text:'', time:Date.now()});
  saveChats(APP.chats);
  const el = document.createElement('div');
  el.className = 'bub ai';
  el.innerHTML = `<div class="bub-head"><span>Wave</span><button class="bub-copy">📋</button></div><span class="ink"></span><span class="caret"></span>`;
  $('flow').appendChild(el);
  const span = el.querySelector('.ink'), cur2 = el.querySelector('.caret');
  const cp = el.querySelector('.bub-copy');
  let i = 0;
  (function step(){
    if(i >= full.length){
      cur2.remove();
      c.messages[c.messages.length-1].text = full;
      saveChats(APP.chats);
      cp.onclick = () => clip(full);
      return;
    }
    span.innerHTML = md(full.substring(0, i+1));
    i++;
    $('flow').scrollTop = $('flow').scrollHeight;
    setTimeout(step, 14);
  })();
}

/* ================= ИИ ================= */
const BACKENDS = [
  {k:'deepseek', n:'DeepSeek', s:'Умная', b:'SMART'},
  {k:'openai', n:'OpenAI', s:'Быстрая', b:'FAST'},
  {k:'mistral', n:'Mistral', s:'Универсальная', b:'NORMAL'},
  {k:'qwen-coder', n:'Qwen', s:'Для кода', b:'CODE'}
];

async function callBackend(kind, text){
  const msgs = [
    {role:'system', content:'Ты Wave — дружелюбный ИИ-ассистент. Помогаешь со школьными задачами. Решай пошагово. Отвечай по-русски.'},
    ...APP.memory,
    {role:'user', content: text}
  ];
  const r = await fetch('https://text.pollinations.ai/openai', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({model: kind, messages: msgs, temperature:0.8})
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d = await r.json();
  let rep = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || d.response || '';
  rep = String(rep).trim();
  if(!rep) throw new Error('empty');
  return rep;
}

async function respond(text){
  APP.memory.push({role:'user', content:text});
  if(APP.memory.length>10) APP.memory = APP.memory.slice(-10);
  const order = [APP.backend, ...BACKENDS.filter(b=>b.k!==APP.backend).map(b=>b.k)];
  for(const k of order){
    try{ return await callBackend(k, text); }
    catch(e){ console.warn(k, e.message); }
  }
  return offlineReply(text);
}

function offlineReply(text){
  const t = text.toLowerCase();
  const m = t.match(/[\d]+[\d\s+\-*/().]*[\d]/);
  if(m){
    try{
      const expr = m[0].replace(/[^0-9+\-*/().]/g,'');
      const r = Function('"use strict";return ('+expr+')')();
      if(isFinite(r)) return 'Ответ: '+r;
    }catch(_){}
  }
  if(/привет|здравств|хай/.test(t)) return 'Привет! 👋 Чем помочь?';
  if(/как дела/.test(t)) return 'Отлично! У тебя как?';
  if(/кто ты|что ты/.test(t)) return 'Я Wave — ИИ-ассистент. Помогаю с задачами и просто болтаю.';
  if(/спасибо/.test(t)) return 'Всегда рад! 😊';
  return 'Сейчас не могу подключиться к серверу ИИ. Попробуй ещё раз или переформулируй.';
}

function launch(){

  const text = $('input').value.trim();
  if(!text && !APP.attached) return;
  if(APP.user && !spendCrystal()) return;
  const img = APP.attached;
  APP.attached = null;
  $('att').style.display='none'; $('fileIn').value='';
  appendMsg('user', text || '[Изображение]', false, img);
  $('input').value = '';
  showWait();

  respond(text || 'Опиши изображение')
    .then(r => { hideWait(); APP.working=false; $('go').disabled=false; pourInk(r); })
    .catch(e => { hideWait(); APP.working=false; $('go').disabled=false; appendMsg('wave','Ошибка: '+e.message); });
}

function clearChat(){

function exportChat(){

function copyChat(){

function clip(txt){
  vibrate();
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(()=>note('Скопировано ✓')).catch(()=>{});
  }

/* ================= ТЕРМИНАЛ ================= */
function openTerm(){
  vibrate();
  closeSheet('menuSheet');
  $('term').classList.add('on');
  $('termLog').innerHTML = '<div class="li"><span class="p">$</span>Wave Terminal v1.0</div><div class="li dm">Введи "help" для списка команд</div>';
  setTimeout(() => $('termInput').focus(), 200);
}
function closeTerm(){ $('term').classList.remove('on'); }

function termCmd(line){
  const log = $('termLog');
  const add = (cls, txt) => {
    const d = document.createElement('div');
    d.className = 'li';
    d.innerHTML = cls ? `<span class="${cls}">${esc(txt)}</span>` : esc(txt);
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  };
  add('p', '› '+line);
  const [cmd, ...args] = line.trim().split(/\s+/);
  const arg = args.join(' ');
  switch(cmd){
    case 'help':
      ['help — список команд','clear — очистить','theme <name> — сменить тему',
       'theme list — все темы','model <name> — модель','whoami — кто я',
       'crystals — кристаллы','say <text> — озвучить','calc <expr> — калькулятор',
       'time — время','date — дата','exit — закрыть'].forEach(l => add('in', l));
      break;
    case 'clear': log.innerHTML=''; break;
    case 'theme':
      if(arg==='list') add('in', Object.keys(THEMES).join(', '));
      else if(THEMES[arg]){ setTheme(arg); add('ok', 'Тема: '+THEMES[arg][1]); }
      else add('er', 'Неизвестная тема');
      break;
    case 'model':
      if(BACKENDS.find(b=>b.k===arg)){ APP.backend=arg; add('ok', 'Модель: '+arg); }
      else add('er', 'Модели: '+BACKENDS.map(b=>b.k).join(', '));
      break;
    case 'whoami':
      const u = me();
      add('in', u ? `${u.avatar} ${u.name} (${u.email}) 💎${u.crystals}` : 'Гость');
      break;
    case 'crystals':
      const u2 = me();
      add('in', u2 ? `💎 ${u2.crystals}` : 'Требуется вход');
      break;
    case 'say':
      if(arg) say(arg); else add('er','say <text>');
      break;
    case 'calc':
      try{ add('ok', String(Function('"use strict";return ('+arg+')')())); }
      catch(_){ add('er','Ошибка'); }
      break;
    case 'time': add('in', new Date().toLocaleTimeString()); break;
    case 'date': add('in', new Date().toLocaleDateString()); break;
    case 'exit': closeTerm(); break;
    default: add('er', 'Команда не найдена: '+cmd);
  }
}
$('termInput').addEventListener('keydown', e => {
  if(e.key==='Enter'){
    const v = e.target.value;
    if(v.trim()) termCmd(v);
    e.target.value='';
  }
});

/* ================= ГОЛОС ================= */
function openVoice(){
  vibrate();
  $('voice').classList.add('on');
  $('vt').textContent='Нажми кнопку и говори';
  $('vs').textContent='ГОТОВ';
}
function closeVoice(){
  if(APP.rec && APP.hearing) APP.rec.stop();
  $('voice').classList.remove('on');
}
function setupVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  const rec = new SR();
  rec.lang='ru-RU'; rec.interimResults=true; rec.continuous=false;
  rec.onstart = () => { APP.hearing=true; $('vb').classList.add('live'); $('vs').textContent='СЛУШАЮ'; APP.heard=''; };
  rec.onresult = e => {
    let t = '';
    for(let i=e.resultIndex; i<e.results.length; i++) t += e.results[i][0].transcript;
    $('vt').textContent = t;
    if(e.results[e.results.length-1].isFinal) APP.heard = t;
  };
  rec.onerror = () => { APP.hearing=false; $('vb').classList.remove('live'); $('vs').textContent='ОШИБКА'; };
  rec.onend = () => {
    APP.hearing=false; $('vb').classList.remove('live');
    const t = (APP.heard || $('vt').textContent).trim();
    if(t){ $('input').value = t; closeVoice(); launch(); }
    else $('vs').textContent='НЕ РАССЛЫШАЛ';
  };
  APP.rec = rec;
}
function say(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); }catch{}
  const clean = text.replace(/```[\s\S]*?```/g,' [код] ').replace(/[*_`#]/g,'').trim();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang='ru-RU'; u.rate=1.05; u.pitch=0.85;
  const v = speechSynthesis.getVoices();
  const ru = v.find(x=>x.lang==='ru-RU') || v.find(x=>x.lang&&x.lang.startsWith('ru'));
  if(ru) u.voice = ru;
  speechSynthesis.speak(u);
}

  // тема

  // модель
  try{ const b = localStorage.getItem('wv_backend'); if(b) APP.backend=b; }catch{}

  addEventListener('online', () => { if($('netDot')) $('netDot').className='dot'; note('Соединение восстановлено'); });
  addEventListener('offline', () => { if($('netDot')) $('netDot').className='dot off'; note('Нет интернета'); });

  // intro
  introAnimate();

  // daily check каждую минуту

  document.addEventListener('click', e => {
    if(e.target.closest('button, input, .sheet, .modal, #term, #voice')) return;
    if(!APP.working) $('input').focus();
  });
}
