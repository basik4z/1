<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;background-size:400% 400%;animation:gS 15s ease infinite;transition:background .8s}
@keyframes gS{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#bg.wave{background:linear-gradient(135deg,#001f3f,#0074D9,#39CCCC);background-size:400% 400%}
#bg.lion{background:linear-gradient(135deg,#7c2d12,#ea580c,#fbbf24);background-size:400% 400%}
#bg.crocodile{background:linear-gradient(135deg,#052e16,#166534,#4ade80);background-size:400% 400%}
#bg.dragon{background:linear-gradient(135deg,#450a0a,#dc2626,#f87171);background-size:400% 400%}
#bg.panda{background:linear-gradient(135deg,#1f1f1f,#525252,#fbcfe8);background-size:400% 400%}
#bg.tiger{background:linear-gradient(135deg,#1c1917,#ea580c,#fbbf24);background-size:400% 400%}
#bg.frog{background:linear-gradient(135deg,#022c22,#059669,#6ee7b7);background-size:400% 400%}
#bg.wolf{background:linear-gradient(135deg,#0a0a0a,#404040,#a3a3a3);background-size:400% 400%}
#bg.shark{background:linear-gradient(135deg,#082f49,#0284c7,#67e8f9);background-size:400% 400%}
#bg.bee{background:linear-gradient(135deg,#000,#ca8a04,#fde047);background-size:400% 400%}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fxb{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.3);animation:bu linear infinite}

.fxr{position:absolute;top:-100px;width:80px;height:300px;background:linear-gradient(180deg,rgba(255,255,200,.3),transparent);transform-origin:top center;animation:rp 4s ease-in-out infinite}
@keyframes rp{0%,100%{opacity:.3;transform:rotate(-5deg)}50%{opacity:.7;transform:rotate(5deg)}}
.fxw{position:absolute;bottom:0;left:0;width:200%;height:60px;background:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.4) 0,transparent 70%);border-radius:50% 50% 0 0;animation:wm 6s linear infinite}
@keyframes wm{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

#splash{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .6s;background:rgba(0,0,0,.9)}

#splashName span{display:inline-block;opacity:0;transform:translateY(30px);animation:li .6s cubic-bezier(.34,1.56,.64,1) forwards}
#splashEmoji{font-size:60px;opacity:0;animation:li .6s .8s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes li{to{opacity:1;transform:translateY(0)}}
#waveSweep{position:absolute;inset:0;z-index:3;pointer-events:none}
#waveSweep svg{width:100%;height:100%}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;opacity:0;transition:opacity .5s;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));padding-left:16px;padding-right:16px}
#app.show{opacity:1}
header{padding:8px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.brand{font-size:12px;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,.7);font-family:"SF Mono",monospace}
.hbtns{display:flex;gap:6px}
.hbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;font-size:15px;transition:all .15s}
.hbtn:active{transform:scale(.92);background:rgba(255,255,255,.3)}
#faceWrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#face{width:min(58vw,230px);height:min(58vw,230px);position:relative;transition:transform .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 30px rgba(255,255,255,.3))}
#face svg{width:100%;height:100%;overflow:visible}
#face.listening{transform:scale(.92)}
#face.spraying{animation:spA .6s infinite}
@keyframes spA{0%,100%{transform:rotate(-3deg) scale(.95)}50%{transform:rotate(3deg) scale(1.05)}}
#sprayCan{opacity:0;transition:opacity .3s}
#face.spraying #sprayCan{opacity:1;animation:spW .4s infinite}
@keyframes spW{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
#ear{opacity:0;transform-origin:150px 100px;transition:opacity .35s}
#face.listening #ear{opacity:1;animation:eP 1s infinite ease-in-out}
@keyframes eP{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
#hand{opacity:0;transform-origin:190px 150px;transition:opacity .3s}
#face.waving #hand{opacity:1;animation:wH .5s 4 ease-in-out}
@keyframes wH{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(22deg)}}
#mouth{transition:all .15s;transform-origin:100px 130px}
#face.talking #mouth{animation:tA .18s infinite alternate}
@keyframes tA{from{transform:scaleY(1)}to{transform:scaleY(2.8)}}
#face.sad #mouth{transform:translateY(-6px) scaleY(.6) scaleX(.7)}
#face.angry #mouth{transform:translateY(4px) scaleY(1.3) scaleX(.8)}

#eyeL,#eyeR{transform-origin:center;transition:transform .1s}
#face.blink #eyeL,#face.blink #eyeR{transform:scaleY(.08)}

#face.angry #browL,#face.angry #browR{opacity:1}
#face.angry #browL{transform:translateY(6px) rotate(20deg)}
#face.angry #browR{transform:translateY(6px) rotate(-20deg)}
#face.surprised #browL,#face.surprised #browR{opacity:1}
#face.surprised #browL{transform:translateY(-8px)}
#face.surprised #browR{transform:translateY(-8px)}
#pupilL,#pupilR{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#face.listening #pupilL,#face.listening #pupilR{transform:translate(3px,0)}
#face.talking #eyeL,#face.talking #eyeR{transform:scaleY(.75)}
#browL,#browR{transition:all .3s}
#face.listening #browL,#face.listening #browR{opacity:1}
#dialog{text-align:center;font-size:17px;font-weight:300;line-height:1.45;color:#fff;max-width:92%;margin:0 auto 8px;min-height:44px;padding:0 8px;overflow-y:auto;max-height:20vh;transition:all .3s;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#dialog .you{color:rgba(255,255,255,.6);font-size:11px;display:block;margin-bottom:3px;letter-spacing:2px;text-transform:uppercase;font-family:"SF Mono",monospace}
#dialog .wave{color:#39CCCC;font-size:11px;display:block;margin-bottom:3px;letter-spacing:2px;text-transform:uppercase;font-family:"SF Mono",monospace}
#imgBox{margin:0 auto 8px;max-width:75%;display:none;animation:iI .6s cubic-bezier(.34,1.56,.64,1)}
#imgBox.show{display:block}
@keyframes iI{from{opacity:0;transform:scale(.5) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}
#imgBox img{width:100%;border-radius:20px;border:2px solid rgba(255,255,255,.4);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#attached{max-width:60%;margin:0 auto 8px;display:none;position:relative}
#attached.show{display:block}
#attached img{width:100%;border-radius:14px;border:2px solid rgba(255,255,255,.5);box-shadow:0 6px 20px rgba(0,0,0,.5)}
#attached .rm{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;background:#dc2626;color:#fff;border:2px solid #fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:inherit}
#status{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.5);font-family:"SF Mono",monospace;text-align:center;margin-bottom:10px;min-height:14px;flex-shrink:0;transition:color .3s}

#quick{display:flex;gap:6px;padding:0 0 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#quick::-webkit-scrollbar{display:none}
.qbtn{flex-shrink:0;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.qbtn:active{transform:scale(.94);background:rgba(255,255,255,.3)}
#controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-bottom:10px;flex-shrink:0}
#talkBtn{position:relative;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:2px solid rgba(255,255,255,.5);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0;box-shadow:0 8px 30px rgba(0,0,0,.3)}

#talkBtn.listening::before,#talkBtn.listening::after{content:'';position:absolute;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:rng 1.6s infinite ease-out}
#talkBtn.listening::after{animation-delay:.8s}
@keyframes rng{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.7);opacity:0}}
#talkBtn svg{width:32px;height:32px;stroke:#fff;stroke-width:1.8;fill:none}
.ctrlbtn{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;font-size:18px}
.ctrlbtn:active{transform:scale(.9);background:rgba(255,255,255,.3)}
.ctrlbtn.active{background:#fff;color:#0074D9;border-color:#fff}
#chatInput{display:flex;padding:0 0 8px;gap:6px;flex-shrink:0;align-items:center}
#chatInput input[type=text]{flex:1;padding:12px 16px;border-radius:22px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:15px;font-family:inherit;outline:none}
#chatInput input[type=text]::placeholder{color:rgba(255,255,255,.5)}
#chatInput input[type=text]:focus{border-color:#fff;background:rgba(255,255,255,.25)}
#chatInput button{padding:0 18px;height:44px;border-radius:22px;background:#fff;color:#0074D9;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
#attachBtn{padding:0;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#attachBtn:active{transform:scale(.9);background:rgba(255,255,255,.3)}
#fileInput{display:none}
.panel{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;flex-direction:column;padding:60px 24px 30px;overflow-y:auto}
.panel.show{display:flex}
.panel h3{font-size:22px;margin-bottom:16px;color:#39CCCC}
.panel p{font-size:14px;line-height:1.7;color:rgba(255,255,255,.85);margin-bottom:12px}
.panelClose{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:20px;cursor:pointer;font-family:inherit}
.theme-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.theme-item{padding:16px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);cursor:pointer;text-align:center;font-family:inherit;color:#fff;transition:all .15s}
.theme-item:active{transform:scale(.95);background:rgba(255,255,255,.2)}
.theme-item.active{border-color:#39CCCC;background:rgba(57,204,204,.3)}
.theme-item .em{font-size:32px;display:block;margin-bottom:6px}
.theme-item .nm{font-size:13px}

</style>

<body>
<div id="bg" class="wave"></div>
<div id="fx"></div>
<div id="splash">
  <div id="splashName"></div>
  <svg id="waveSweep" viewBox="0 0 400 800" preserveAspectRatio="none">
    <path id="sweepPath" d="M 0 900 Q 100 900 200 900 T 400 900 L 400 900 L 0 900 Z" fill="#001f3f"/>
  </svg>
</div>
<div id="app">

function renderHistory(){historyList.innerHTML='';if(HISTORY.length===0){historyList.innerHTML='<p style="color:rgba(255,255,255,0.5);font-size:13px">История пуста.</p>';return;}HISTORY.slice(-30).reverse().forEach(function(item){var el=document.createElement('div');el.className='hist-item';var d=new Date(item.time);var ts=d.getDate()+'.'+(d.getMonth()+1)+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();var who=item.role==='user'?'👤 Ты: ':'🌊 Wave: ';el.innerHTML='<div class="date">'+ts+'</div><div class="preview">'+who+escapeHtml(item.text)+'</div>';historyList.appendChild(el);});}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function blink(){face.classList.add('blink');setTimeout(function(){face.classList.remove('blink');},120);setTimeout(blink,2500+Math.random()*3500);}
setTimeout(blink,2000);
function startGreeting(){face.classList.add('waving');setTimeout(function(){face.classList.remove('waving');},2500);var g;if(DEVICE_DATA.visits>1)g='С возвращением! Ты заходил уже '+DEVICE_DATA.visits+' раз.';else g='Привет! Я Wave AI. Буду с тобой сегодня разговаривать.';speak(g);}
document.body.addEventListener('touchstart',function(){initAudio();},{once:true});
document.body.addEventListener('click',function(){initAudio();},{once:true});
</script>
