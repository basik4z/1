<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Нарисуй и угадай</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Seg1oe UI", sans-serif;
s    background: #000 linear; color: #fff;
    touch-action;: none; user-select: none; -webkit border-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 20%, #6366f1 0%, transparent 50%),
      radial-gradient(circle at 80% 30%, #ec4899 0%, transparent 50%),
      radial-gradient(circle at 50% 80%, #06b6d4 0%, transparent 50%),
      radial-gradient(circle at 90% 90%, #8b5cf6 0%, transparent 50%),
      #0a0a0f;
    animation: bgShift 20s ease-in-out infinite;
  }
  @keyframes bgShift { 0%,100%{filter:hue-rotate(0deg)} 50%{filter:hue-rotate(40deg)} }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
  }

  .glass {
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -1px 0 rgba(0,0,0,0.1), 0 8px 32px rgba(0,0,0,0.3);
    border-radius: 22px;
  }

  header {
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600;
    padding: 8px 14px; border-radius: 14px;
  }
  .logo-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #4ade80; box-shadow: 0 0 8px #4ade80;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #status {
    font-size: 11px; color: rgba(255,255,255,0.6);
    padding: 8px 14px; border-radius: 14px;
    max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #hud { display: none; padding: 0 16px 12px; gap: 8px; flex-shrink: 0; }
  #hud.visible { display: flex; }
  .hud-card { flex: 1; padding: 10px 14px; border-radius: 18px; text-align: center; position: relative; overflow: hidden; }
  .hud-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: rgba(255,255,255,0.55); margin-bottom: 3px; font-weight: 600; }
  .hud-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hud-value.timer-warn { color: #f87171; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.5; } }
  #timerBar {
    position: absolute; bottom: 0; left: 0; height: 3px;
    background: linear-gradient(90deg, #4ade80, #06b6d4, #8b5cf6);
    transition: width 0.-radius: 0 3px 3px 0;
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.8);
  }

  #canvasWrap {
    flex: 1; position: relative; margin: 0 12px;
    border-radius: 24px; overflow: hidden;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.5);
    min-height: 0;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }

  #result {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%) scale(0.8);
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 15px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none; max-width: 90%; text-align: center; z-index: 5;
    display: flex; align-items: center; gap: 8px;
  }
  #result.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #result.correct { background: rgba(34, 197, 94, 0.85); border-color: rgba(74, 222, 128, 0.5); }
  #result.wrong { background: rgba(239, 68, 68, 0.85); border-color: rgba(248, 113, 113, 0.5); }
  #result .conf { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 500; margin-left: 4px; }
  #result .emoji { font-size: 20px; }

  footer {
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; flex-shrink: 0;
  }

  button {
    flex: 1; padding: 14px 12px;
    font-size: 14px; font-weight: 600; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    color: #fff; cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 16px rgba(0,0,0,0.2);
    white-space: nowrap;
  }
  button:active { transform: scale(0.95); background: rgba(255,255,255,0.15); }
  button.primary {
    background: linear-gradient(135deg, rgba(99,102,241,0.9), rgba(139,92,246,0.9));
    border-color: rgba(255,255,255,0.25);
  }
  button.primary:active { background: linear-gradient(135deg, rgba(79,70,229,0.95), rgba(124,58,237,0.95)); }
  button.icon { flex: 0 0 auto; padding: 14px; min-width: 52px; }
  button:disabled { opacity: 0.4; pointer-events: none; }

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }

  .modal {
    width: 100%; max-width: 400px; padding: 24px;
    border-radius: 28px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .modal-backdrop.show .modal { transform: scale(1); }

  .modal h2 { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 6px; }
  .modal .subtitle { text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }

  .mode-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .mode-btn {
    padding: 16px; border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; cursor: pointer; font-family: inherit; font-size: 15px;
    display: flex; align-items: center; gap: 14px;
    transition: all 0.15s; text-align: left; width: 100%;
  }
  .mode-btn:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
  .mode-btn .mode-icon {
    font-size: 26px; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); border-radius: 14px; flex-shrink: 0;
  }
  .mode-btn .mode-info { flex: 1; }
  .mode-btn .mode-name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .mode-btn .mode-desc { font-size: 12px; color: rgba(255,255,255,0.55); }

  .difficulty-row { display: flex; gap: 8px; margin-bottom: 20px; }
  .diff-btn {
    flex: 1; padding: 12px 8px; border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; cursor: pointer; font-family: inherit;
    font-size: 13px; font-weight: 600; transition: all 0.15s;
  }
  .diff-btn.active {
    background: linear-gradient(135deg, rgba(99,102,241,0.9), rgba(139,92,246,0.9));
    border-color: rgba(255,255,255,0.3);
    box-shadow: 0 4px 16px rgba(139,92,246,0.5);
  }

  .modal-actions { display: flex; gap: 8px; }

  .final-score {
    text-align: center; font-size: 48px; font-weight: 800;
    background: linear-gradient(135deg, #4ade80, #06b6d4, #8b5cf6);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 8px 0; font-variant-numeric: tabular-nums;
  }
  .final-label { text-align: center; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  .final-detail {
    background: rgba(255,255,255,0.05); border-radius: 16px;
    padding: 14px; margin-bottom: 20px; font-size: 13px; line-height: 1.7;
    color: rgba(255,255,255,0.8);
  }
  .final-detail .row { display: flex; justify-content: space-between; }
  .final-detail .row .val { color: #fff; font-weight: 600; }

  #wordChip {
    display: none; text-align: center;
    padding: 12px; margin: 0 16px 10px; border-radius: 18px;
    font-size: 15px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
  }
  #wordChip.visible { display: block; }
  #wordChip .label { font-size: 11px; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; margin-bottom: 2px; }
  #wordChip .word {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, #fff, #a5b4fc);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ============ ЗАГРУЗОЧНЫЙ ЭКРАН ============ */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: #0a0a0f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    transition: opacity 0.6s ease;
    overflow: hidden;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  #logoAnim {
    font-size: 34px; font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #a5b4fc, #fff, #67e8f9);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    display: flex; flex-wrap: wrap; justify-content: center;
    text-align: center; padding: 0 20px;
    transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
    will-change: transform;
  }
  #logoAnim span {
    display: inline-block; opacity: 0;
    transform: translateY(30px) rotateX(-90deg);
    animation: letterIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0) rotateX(0); } }
  #logoAnim.lift { transform: translateY(-38vh) scale(0.55); }

  #loadBar {
    width: 200px; height: 3px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px; overflow: hidden;
    transition: opacity 0.4s;
  }
  #loadBarFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #06b6d4);
    border-radius: 3px;
    transition: width 0.1s linear;
    box-shadow: 0 0 12px rgba(139,92,246,0.8);
  }

  #loadingText {
    color: rgba(255,255,255,0.5);
    font-size: 13px; text-align: center;
    transition: opacity 0.3s;
  }

  .ico { width: 18px; height: 18px; flex-shrink: 0; }
</style>
</head>
<body>

<div id="bg"></div>

<div id="app">
  <header>
    <div class="logo glass"><span class="logo-dot"></span> Нарисуй и угадай</div>
    <div id="status" class="glass">Загрузка…</div>
  </header>

  <div id="wordChip">
    <div class="label">Нарисуй это</div>
    <div class="word" id="wordText">—</div>
  </div>

  <div id="hud">
    <div class="hud-card glass">
      <div class="hud-label">Время</div>
      <div class="hud-value" id="timerVal">20</div>
      <div id="timerBar" style="width:100%"></div>
    </div>
    <div class="hud-card glass">
      <div class="hud-label">Счёт</div>
      <div class="hud-value" id="scoreVal">0</div>
    </div>
    <div class="hud-card glass">
      <div class="hud-label">Раунд</div>
      <div class="hud-value" id="roundVal">1/5</div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="c"></canvas>
    <div id="result"></div>
  </div>

  <footer>
    <button id="menuBtn" class="icon" title="Меню">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
      </svg>
    </button>
    <button id="undoBtn">↩</button>
    <button id="clearBtn">🧹</button>
    <button id="speakBtn" class="primary">🔊 Озвучить</button>
  </footer>
</div>

<!-- Меню -->
<div class="modal-backdrop" id="menuModal">
  <div class="modal">
    <h2>Нарисуй и угадай</h2>
    <p class="subtitle">Нейросеть распознает твой рисунок</p>

    <div class="mode-list">
      <button class="mode-btn" data-mode="free">
        <div class="mode-icon">🎨</div>
        <div class="mode-info">
          <div class="mode-name">Свободный режим</div>
          <div class="mode-desc">Рисуй что хочешь, я угадаю</div>
        </div>
      </button>
      <button class="mode-btn" data-mode="solo">
        <div class="mode-icon">🎯</div>
        <div class="mode-info">
          <div class="mode-name">Соло-игра</div>
          <div class="mode-desc">5 раундов, угадай слово по рисунку</div>
        </div>
      </button>
      <button class="mode-btn" data-mode="bot">
        <div class="mode-icon">🤖</div>
        <div class="mode-info">
          <div class="mode-name">Против бота</div>
          <div class="mode-desc">5 раундов, кто нарисует лучше</div>
        </div>
      </button>
      <button class="mode-btn" data-mode="friends">
        <div class="mode-icon">👥</div>
        <div class="mode-info">
          <div class="mode-name">С друзьями</div>
          <div class="mode-desc">Передавайте телефон по кругу</div>
        </div>
      </button>
    </div>

    <div style="font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:8px;font-weight:600;">Уровень сложности</div>
    <div class="difficulty-row">
      <button class="diff-btn active" data-diff="easy">Легко<br><span style="font-size:10px;opacity:0.6">30 сек</span></button>
      <button class="diff-btn" data-diff="medium">Средне<br><span style="font-size:10px;opacity:0.6">20 сек</span></button>
      <button class="diff-btn" data-diff="hard">Сложно<br><span style="font-size:10px;opacity:0.6">12 сек</span></button>
    </div>

    <div class="modal-actions">
      <button id="closeModal" style="flex:1">Закрыть</button>
    </div>
  </div>
</div>

<!-- Финал -->
<div class="modal-backdrop" id="gameOverModal">
  <div class="modal">
    <h2 id="goTitle">Игра окончена</h2>
    <div class="final-score" id="goScore">0</div>
    <div class="final-label" id="goLabel">очков</div>
    <div class="final-detail" id="goDetail"></div>
    <div class="modal-actions">
      <button id="goAgain">🔄 Ещё раз</button>
      <button id="goMenu" class="primary">🏠 В меню</button>
    </div>
  </div>
</div>

<div id="loading">
  <div id="logoAnim"></div>
  <div id="loadBar"><div id="loadBarFill"></div></div>
  <div id="loadingText">Готовлюсь…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
