<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wave AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Wave AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    background: #000; color: #fff;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  header {
    padding: 14px 4px 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-shrink: 0;
  }
  .brand {
    font-size: 12px; letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    font-family: "SF Mono", ui-monospace, monospace;
  }
  .hbtn {
    width: 36px; height: 36px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit; font-size: 16px;
  }
  .hbtn:active { transform: scale(0.92); background: rgba(255,255,255,0.14); }
  .hbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  #faceWrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
  }
  #face {
    width: min(60vw, 240px); height: min(60vw, 240px);
    position: relative;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #face svg { width: 100%; height: 100%; overflow: visible; }
  #face.listening { transform: scale(0.92); }

  #ear {
    opacity: 0;
    transform-origin: 150px 100px;
    transition: opacity 0.35s ease;
  }
  #face.listening #ear {
    opacity: 1;
    animation: earPulse 1s infinite ease-in-out;
  }
  @keyframes earPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  #hand {
    opacity: 0;
    transform-origin: 190px 150px;
    transition: opacity 0.3s;
  }
  #face.waving #hand {
    opacity: 1;
    animation: waveHand 0.5s infinite ease-in-out;
  }
  @keyframes waveHand {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(22deg); }
  }

  #mouth {
    transition: all 0.15s ease;
    transform-origin: 100px 130px;
  }
  #face.talking #mouth {
    animation: talkAnim 0.18s infinite alternate ease-in-out;
  }
  @keyframes talkAnim {
    from { transform: scaleY(1); }
    to { transform: scaleY(2.8); }
  }

  #eyeL, #eyeR { transform-origin: center; transition: transform 0.1s; }
  #face.blink #eyeL, #face.blink #eyeR { transform: scaleY(0.08); }
  #pupilL, #pupilR { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #face.listening #pupilL { transform: translate(3px, 0); }
  #face.listening #pupilR { transform: translate(3px, 0); }
  #face.talking #eyeL, #face.talking #eyeR { transform: scaleY(0.75); }
  #browL, #browR { transition: opacity 0.3s; }
  #face.listening #browL, #face.listening #browR { opacity: 1; }

  #dialog {
    text-align: center; font-size: 17px; font-weight: 300;
    line-height: 1.45; color: #fff;
    max-width: 92%; margin: 0 auto 8px;
    min-height: 48px; padding: 0 8px;
    overflow-y: auto; max-height: 22vh;
  }
  #dialog .you {
    color: rgba(255,255,255,0.4);
    font-size: 11px; display: block;
    margin-bottom: 3px; letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }
  #dialog .wave {
    color: #d4d4d8;
    font-size: 11px; display: block;
    margin-bottom: 3px; letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }

  #status {
    font-size: 10px; letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
    text-align: center; margin-bottom: 10px;
    min-height: 14px; flex-shrink: 0;
    transition: color 0.3s;
  }
  #status.listening { color: #fff; }
  #status.speaking { color: #d4d4d8; }
  #status.thinking { color: #a1a1aa; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  #quick {
    display: flex; gap: 6px;
    padding: 0 4px 8px;
    overflow-x: auto; flex-shrink: 0;
    scrollbar-width: none;
  }
  #quick::-webkit-scrollbar { display: none; }
  .qbtn {
    flex-shrink: 0;
    padding: 8px 14px; border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; font-size: 12px;
    cursor: pointer; font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .qbtn:active { transform: scale(0.94); background: rgba(255,255,255,0.14); }

  #controls {
    display: flex; gap: 10px;
    align-items: center; justify-content: center;
    margin-bottom: 10px; flex-shrink: 0;
  }
  #talkBtn {
    position: relative;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: #000;
    border: 1.5px solid rgba(255,255,255,0.25);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none; font-family: inherit; flex-shrink: 0;
  }
  #talkBtn:active { transform: scale(0.94); }
  #talkBtn.active {
    background: #fff; border-color: #fff;
    box-shadow: 0 0 60px rgba(255,255,255,0.5);
  }
  #talkBtn.active svg { stroke: #000; }
  #talkBtn.listening::before,
  #talkBtn.listening::after {
    content: '';
    position: absolute;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    animation: ring 1.6s infinite ease-out;
  }
  #talkBtn.listening::after { animation-delay: 0.8s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  #talkBtn svg {
    width: 32px; height: 32px;
    stroke: #fff; stroke-width: 1.6;
    fill: none; transition: stroke 0.2s;
  }
  .ctrlbtn {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .ctrlbtn:active { transform: scale(0.9); background: rgba(255,255,255,0.14); }
  .ctrlbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .ctrlbtn.active { background: #fff; color: #000; border-color: #fff; }

  #chatInput {
    display: none;
    padding: 0 4px 8px;
    gap: 6px; flex-shrink: 0;
  }
  #chatInput.visible { display: flex; }
  #chatInput input {
    flex: 1;
    padding: 12px 16px; border-radius: 22px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; font-size: 15px;
    font-family: inherit; outline: none;
  }
  #chatInput input::placeholder { color: rgba(255,255,255,0.3); }
  #chatInput input:focus { border-color: rgba(255,255,255,0.5); }
  #chatInput button {
    padding: 0 18px; border-radius: 22px;
    background: #fff; color: #000;
    border: none; font-weight: 600;
    font-size: 14px; cursor: pointer;
    font-family: inherit;
  }

  .panel {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .panel.show { opacity: 1; pointer-events: auto; }
  .panel-inner {
    width: 100%; max-height: 85vh; overflow-y: auto;
    background: #0a0a0a;
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px 28px 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .panel.show .panel-inner { transform: translateY(0); }
  .panel-handle {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px; margin: 0 auto 16px;
  }
  .panel-title {
    font-size: 20px; font-weight: 600;
    margin-bottom: 20px;
  }
  .setting {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  .setting:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: #e4e4e7; }
  .setting-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-val {
    font-size: 12px; color: #d4d4d8;
    font-family: "SF Mono", ui-monospace, monospace;
    min-width: 34px; text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 110px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  select {
    padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff; font-family: inherit;
    font-size: 13px; outline: none;
    max-width: 160px;
  }
  select option { background: #1a1a1a; }
  .close-panel {
    width: 100%; padding: 14px; margin-top: 16px;
    border-radius: 16px;
    background: #fff; color: #000;
    border: none; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }

  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px; padding: 40px 24px;
    transition: opacity 0.8s ease;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }
  #startName {
    font-size: 46px; font-weight: 200;
    letter-spacing: -1px; color: #fff;
    display: flex; flex-wrap: wrap; justify-content: center;
  }
  #startName span {
    display: inline-block; opacity: 0;
    transform: translateY(20px);
    animation: letterIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0); } }
  #startSub {
    font-size: 11px; letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    font-family: "SF Mono", ui-monospace, monospace;
    opacity: 0; animation: fadeIn 1s ease 1s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  #startBtn {
    padding: 16px 48px; border-radius: 40px;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.4);
    color: #fff; font-size: 13px;
    letter-spacing: 4px; text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
    cursor: pointer; transition: all 0.3s;
    opacity: 0; animation: fadeIn 1s ease 1.5s forwards;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:active { transform: scale(0.95); }
  #startBtn:hover { background: #fff; color: #000; }

  @media (max-width: 400px) {
    #dialog { font-size: 15px; }
    #talkBtn { width: 76px; height: 76px; }
    #talkBtn svg { width: 28px; height: 28px; }
    #startName { font-size: 36px; }
    .ctrlbtn { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">WAVE · AI</div>
    <button class="hbtn" id="settingsBtn">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div id="faceWrap">
    <div id="face">
      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="78" fill="#000" stroke="#fff" stroke-width="3"/>

        <g id="eyeL">
          <ellipse cx="74" cy="86" rx="10" ry="13" fill="#fff"/>
          <circle id="pupilL" cx="74" cy="86" r="5" fill="#000"/>
          <circle cx="77" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>
        <g id="eyeR">
          <ellipse cx="126" cy="86" rx="10" ry="13" fill="#fff"/>
          <circle id="pupilR" cx="126" cy="86" r="5" fill="#000"/>
          <circle cx="129" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>

        <path id="browL" d="M 62 68 Q 74 62 88 68" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>
        <path id="browR" d="M 112 68 Q 126 62 138 68" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>

        <path id="mouth" d="M 78 128 Q 100 138 122 128" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>

        <g id="ear" transform="translate(150, 100)">
          <path d="M 0 0 C -6 -14, 4 -24, 12 -18 C 19 -12, 19 -2, 12 4 C 6 9, 0 7, 0 0 Z" fill="#fff"/>
          <path d="M 4 0 C 1 -9, 6 -16, 10 -12 C 14 -8, 14 -2, 10 2 C 7 4, 4 3, 4 0 Z" fill="#000" opacity="0.4"/>
        </g>

        <g id="hand" transform="translate(160, 130)">
          <path d="M 0 28 C -4 16, -2 6, 4 2 L 4 2 C 4 -4, 8 -6, 10 -4 L 12 -4 C 12 -10, 16 -12, 18 -8 L 20 -8 C 20 -14, 24 -16, 26 -12 L 28 -10 C 30 -6, 30 2, 28 10 C 26 20, 22 28, 16 30 C 8 32, 2 32, 0 28 Z" fill="#fff"/>
          <line x1="6" y1="6" x2="6" y2="-2" stroke="#000" stroke-width="1" opacity="0.4"/>
          <line x1="14" y1="0" x2="14" y2="-8" stroke="#000" stroke-width="1" opacity="0.4"/>
          <line x1="22" y1="-2" x2="22" y2="-10" stroke="#000" stroke-width="1" opacity="0.4"/>
        </g>
      </svg>
    </div>
  </div>

  <div id="dialog"></div>
  <div id="status">готов</div>

  <div id="quick">
    <button class="qbtn" data-say="привет">👋 Привет</button>
    <button class="qbtn" data-say="как дела">💭 Как дела</button>
    <button class="qbtn" data-say="расскажи шутку">😂 Шутка</button>
    <button class="qbtn" data-say="расскажи факт">💡 Факт</button>
    <button class="qbtn" data-say="который час">🕐 Время</button>
    <button class="qbtn" data-say="загадай загадку">🧩 Загадка</button>
  </div>

  <div id="controls">
    <button class="ctrlbtn" id="repeatBtn" title="Повторить">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
    <button id="talkBtn" aria-label="Говорить">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <button class="ctrlbtn" id="chatBtn" title="Чат">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
  </div>

  <div id="chatInput">
    <input id="chatField" type="text" placeholder="Напиши сообщение…" autocomplete="off">
    <button id="chatSend">→</button>
  </div>
</div>

<div class="panel" id="settingsPanel">
  <div class="panel-inner">
    <div class="panel-handle"></div>
    <div class="panel-title">Настройки</div>

    <div class="setting">
      <div>
        <div class="setting-label">Скорость речи</div>
        <div class="setting-sub">как быстро говорит</div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.05" value="1">
        <div class="slider-val" id="rateVal">1.0</div>
      </div>
    </div>

    <div class="setting">
      <div>
        <div class="setting-label">Высота голоса</div>
        <div class="setting-sub">тембр (ниже/выше)</div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="pitchSlider" min="0.5" max="1.5" step="0.05" value="1">
        <div class="slider-val" id="pitchVal">1.0</div>
      </div>
    </div>

    <div class="setting">
      <div>
        <div class="setting-label">Громкость</div>
        <div class="setting-sub">звук Wave AI</div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
        <div class="slider-val" id="volVal">1.0</div>
      </div>
    </div>

    <div class="setting">
      <div>
        <div class="setting-label">Озвучка</div>
        <div class="setting-sub">Wave говорит вслух</div>
      </div>
      <div class="switch" id="voiceSwitch"></div>
    </div>

    <button class="close-panel" id="closePanel">Готово</button>
  </div>
</div>

<div id="startScreen">
  <div id="startName"></div>
  <div id="startSub">voice assistant</div>
  <button id="startBtn">Начать</button>
</div>

<script>
/* ===========================
   ЧАСТЬ 1: ЛОГИКА
   =========================== */
const face = document.getElementById('face');
const dialogEl = document.getElementById('dialog');
const statusEl = document.getElementById('status');
const talkBtn = document.getElementById('talkBtn');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const startName = document.getElementById('startName');
const chatBtn = document.getElementById('chatBtn');
const chatInput = document.getElementById('chatInput');
const chatField = document.getElementById('chatField');
const chatSend = document.getElementById('chatSend');
const repeatBtn = document.getElementById('repeatBtn');
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const closePanel = document.getElementById('closePanel');

/* Имя по буквам */
['W','a','v','e',' ','A','I'].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  s.style.animationDelay = (i * 80) + 'ms';
  startName.appendChild(s);
});

/* Звуки */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playStartup() {
  initAudio();
  const t = audioCtx.currentTime;
  const o1 = audioCtx.createOscillator();
  const g1 = audioCtx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(220, t);
  o1.frequency.exponentialRampToValueAtTime(880, t + 0.6);
  g1.gain.setValueAtTime(0.0001, t);
  g1.gain.exponentialRampToValueAtTime(0.15, t + 0.1);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  o1.connect(g1).connect(audioCtx.destination);
  o1.start(t); o1.stop(t + 0.8);
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(1320, t + 0.5);
  o2.frequency.exponentialRampToValueAtTime(1760, t + 0.7);
  g2.gain.setValueAtTime(0.0001, t + 0.5);
  g2.gain.exponentialRampToValueAtTime(0.12, t + 0.55);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
  o2.connect(g2).connect(audioCtx.destination);
  o2.start(t + 0.5); o2.stop(t + 1.1);
}
function playClick() {
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(880, t);
  o.frequency.exponentialRampToValueAtTime(1400, t + 0.07);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.25);
}
function playListenSound() {
  initAudio();
  const t = audioCtx.currentTime;
  [660, 880].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + i * 0.09);
    g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.18);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.25);
  });
}
function playError() {
  initAudio();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(120, t + 0.2);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.08, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.35);
}

/* Настройки */
const settings = {
  rate: 1.0,
  pitch: 1.05,
  volume: 1.0,
  voiceOn: true
};

/* Моргание */
function blink() {
  face.classList.add('blink');
  setTimeout(() => face.classList.remove('blink'), 120);
  setTimeout(blink, 2500 + Math.random() * 3500);
}
setTimeout(blink, 1500);

/* Очередь на озвучку */
let speakQueue = [];
let isSpeakingNow = false;
let currentUtterance = null;

function showWaveText(text) {
  dialogEl.innerHTML = `<span class="wave">Wave</span>${text}`;
}
function showUserText(text) {
  dialogEl.innerHTML = `<span class="you">ты</span>${text}`;
}

/* ===========================
   ЧАСТЬ 2: ОЗВУЧКА ЧЕЛОВЕЧЕСКИМ ГОЛОСОМ
   =========================== */
/* Используем живые системные голоса (выбираем лучший) */
let bestVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const pref = [
    v => v.name.includes('Milena') && (v.name.includes('Premium') || v.name.includes('Enhanced')),
    v => v.name.includes('Yuri') && (v.name.includes('Premium') || v.name.includes('Enhanced')),
    v => v.name.includes('Milena') && v.lang === 'ru-RU',
    v => v.name.includes('Yuri') && v.lang === 'ru-RU',
    v => v.name.includes('Milena'),
    v => v.name.includes('Yuri'),
    v => v.name.includes('Katya'),
    v => v.lang === 'ru-RU',
    v => v.lang && v.lang.startsWith('ru')
  ];
  for (const test of pref) {
    const f = voices.find(test);
    if (f) { bestVoice = f; return; }
  }
}
speechSynthesis.onvoiceschanged = pickVoice;
pickVoice();
setTimeout(pickVoice, 300);
setTimeout(pickVoice, 1000);

function speak(text, onEnd) {
  if (!settings.voiceOn) { onEnd && onEnd(); return; }
  if (!('speechSynthesis' in window)) { onEnd && onEnd(); return; }

  speechSynthesis.cancel();
  showWaveText(text);

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  u.rate = settings.rate;
  u.pitch = settings.pitch;
  u.volume = settings.volume;
  if (bestVoice) u.voice = bestVoice;
  currentUtterance = u;

  u.onstart = () => {
    face.classList.add('talking');
    face.classList.remove('listening', 'waving');
    statusEl.textContent = 'говорит';
    statusEl.className = 'speaking';
  };
  u.onend = () => {
    face.classList.remove('talking');
    statusEl.textContent = 'готов';
    statusEl.className = '';
    currentUtterance = null;
    onEnd && onEnd();
  };
  u.onerror = () => {
    face.classList.remove('talking');
    statusEl.textContent = 'готов';
    statusEl.className = '';
    currentUtterance = null;
    onEnd && onEnd();
  };
  speechSynthesis.speak(u);
}

/* ===========================
   ЧАСТЬ 3: РАСПОЗНАВАНИЕ РЕЧИ
   =========================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
let finalText = '';

if (SR) {
  recognition = new SR();
  recognition.lang = 'ru-RU';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    isListening = true;
    face.classList.add('listening');
    talkBtn.classList.add('active', 'listening');
    statusEl.textContent = 'слушаю';
    statusEl.className = 'listening';
    finalText = '';
    dialogEl.innerHTML = '';
  };

  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    if (final) finalText += final;
    dialogEl.innerHTML = `<span class="you">ты</span>${(finalText + ' ' + interim).trim()}`;
  };

  recognition.onerror = (e) => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('active', 'listening');
    if (e.error === 'not-allowed') {
      showWaveText('Дай доступ к микрофону в настройках Safari.');
      playError();
    } else if (e.error === 'no-speech') {
      showWaveText('Я тебя не услышал.');
    }
    statusEl.textContent = 'готов';
    statusEl.className = '';
  };

  recognition.onend = () => {
    isListening = false;
    face.classList.remove('listening');
    talkBtn.classList.remove('listening');
    if (finalText.trim()) {
      showUserText(finalText.trim());
      setTimeout(() => respondTo(finalText.trim().toLowerCase()), 300);
    } else {
      statusEl.textContent = 'готов';
      statusEl.className = '';
    }
  };
}
</script>
