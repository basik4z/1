<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wave AI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Wave AI</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif;
    background: #000; color: #fff;
    user-select: none; -webkit-user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ ФОН: чёрный + серебряные блики ============ */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 30% 20%, rgba(220,220,230,0.10) 0%, transparent 55%),
      radial-gradient(circle at 70% 75%, rgba(180,180,200,0.08) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(120,120,140,0.05) 0%, transparent 70%),
      #000;
    animation: bgShift 25s ease-in-out infinite;
  }
  @keyframes bgShift {
    0%, 100% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(15deg) brightness(1.1); }
  }

  /* Звёздочки */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }

  /* ============ LIQUID GLASS ============ */
  .glass {
    background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.22),
      inset 0 -1px 0 rgba(0,0,0,0.15),
      0 10px 40px rgba(0,0,0,0.5);
    border-radius: 22px;
  }

  /* ============ HEADER ============ */
  header {
    padding: 14px 4px 8px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; flex-shrink: 0;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    font-family: "SF Mono", ui-monospace, monospace;
    font-weight: 500;
  }
  .brand span { color: #d4d4d8; }
  .header-btns { display: flex; gap: 6px; }
  .hbtn {
    width: 34px; height: 34px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #d4d4d8;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
    font-size: 15px;
  }
  .hbtn:active { transform: scale(0.92); background: rgba(255,255,255,0.14); }
  .hbtn.active { background: #d4d4d8; color: #000; border-color: #d4d4d8; }
  .hbtn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* ============ СМАЙЛИК ============ */
  #faceWrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; min-height: 0;
    transition: flex 0.4s;
  }
  #face {
    width: min(58vw, 230px);
    height: min(58vw, 230px);
    position: relative;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 10px 30px rgba(200,200,220,0.15));
  }
  #face svg { width: 100%; height: 100%; overflow: visible; }

  #face.listening { transform: scale(0.92); }

  /* Ухо внутри круга */
  #ear {
    opacity: 0;
    transform-origin: 150px 100px;
    transition: opacity 0.35s ease;
  }
  #face.listening #ear {
    opacity: 1;
    animation: earPulse 1s infinite ease-in-out;
  }
  @keyframes earPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  /* Рука машет */
  #hand {
    opacity: 0;
    transform-origin: 190px 150px;
    transition: opacity 0.3s;
  }
  #face.waving #hand {
    opacity: 1;
    animation: waveHand 0.5s infinite ease-in-out;
  }
  @keyframes waveHand {
    0%, 100% { transform: rotate(-18deg); }
    50% { transform: rotate(22deg); }
  }

  /* Рот */
  #mouth {
    transition: all 0.15s ease;
    transform-origin: 100px 130px;
  }
  #face.talking #mouth {
    animation: talkAnim 0.18s infinite alternate ease-in-out;
  }
  @keyframes talkAnim {
    from { transform: scaleY(1); }
    to { transform: scaleY(2.8); }
  }

  /* Глаза */
  #eyeL, #eyeR { transform-origin: center; transition: transform 0.1s; }
  #face.blink #eyeL, #face.blink #eyeR { transform: scaleY(0.08); }
  #pupilL, #pupilR { transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
  #face.listening #pupilL { transform: translate(3px, 0); }
  #face.listening #pupilR { transform: translate(3px, 0); }
  #face.talking #eyeL, #face.talking #eyeR { transform: scaleY(0.75); }

  #browL, #browR { transition: opacity 0.3s; }
  #face.listening #browL, #face.listening #browR { opacity: 1; }

  /* ============ ДИАЛОГ ============ */
  #dialog {
    text-align: center;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.45;
    color: #fff;
    max-width: 92%;
    margin: 0 auto 8px;
    min-height: 48px;
    padding: 0 8px;
    transition: all 0.3s;
    overflow-y: auto;
    max-height: 22vh;
  }
  #dialog .you {
    color: rgba(255,255,255,0.4);
    font-size: 11px; display: block;
    margin-bottom: 3px; letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }
  #dialog .wave {
    color: #d4d4d8;
    font-size: 11px; display: block;
    margin-bottom: 3px; letter-spacing: 2px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
  }

  #status {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    font-family: "SF Mono", ui-monospace, monospace;
    text-align: center;
    margin-bottom: 10px;
    min-height: 14px;
    transition: color 0.3s;
    flex-shrink: 0;
  }
  #status.listening { color: #fff; }
  #status.speaking { color: #d4d4d8; }
  #status.thinking { color: #a1a1aa; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.5; } }

  /* ============ БЫСТРЫЕ КНОПКИ ============ */
  #quick {
    display: flex;
    gap: 6px;
    padding: 0 4px 8px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  #quick::-webkit-scrollbar { display: none; }
  .qbtn {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #d4d4d8;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .qbtn:active { transform: scale(0.94); background: rgba(255,255,255,0.14); }

  /* ============ КНОПКИ ============ */
  #controls {
    display: flex;
    gap: 10px; align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  #talkBtn {
    position: relative;
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1a1a, #000);
    border: 1.5px solid rgba(255,255,255,0.25);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    outline: none;
    font-family: inherit;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 24px rgba(0,0,0,0.5);
  }
  #talkBtn:hover {
    border-color: rgba(212,212,216,0.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 0 40px rgba(212,212,216,0.2);
  }
  #talkBtn:active { transform: scale(0.94); }
  #talkBtn.active {
    background: linear-gradient(135deg, #f4f4f5, #d4d4d8);
    border-color: #f4f4f5;
    box-shadow: 0 0 60px rgba(228,228,231,0.5);
  }
  #talkBtn.active svg { stroke: #000; }
  #talkBtn.listening::before,
  #talkBtn.listening::after {
    content: '';
    position: absolute;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 1.5px solid rgba(212,212,216,0.4);
    animation: ring 1.6s infinite ease-out;
  }
  #talkBtn.listening::after { animation-delay: 0.8s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  #talkBtn svg {
    width: 32px; height: 32px;
    stroke: #fff; stroke-width: 1.6;
    fill: none;
    transition: stroke 0.2s;
  }

  .ctrlbtn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    color: #d4d4d8;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    font-family: inherit;
  }
  .ctrlbtn:active { transform: scale(0.9); background: rgba(255,255,255,0.14); }
  .ctrlbtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .ctrlbtn.active { background: #d4d4d8; color: #000; border-color: #d4d4d8; }

  /* ============ ТЕКСТОВЫЙ ЧАТ ============ */
  #chatInput {
    display: none;
    padding: 0 4px 8px;
    gap: 6px;
    flex-shrink: 0;
  }
  #chatInput.visible { display: flex; }
  #chatInput input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 22px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }
  #chatInput input::placeholder { color: rgba(255,255,255,0.3); }
  #chatInput input:focus {
    border-color: rgba(212,212,216,0.5);
    background: rgba(255,255,255,0.1);
  }
  #chatInput button {
    padding: 0 18px;
    border-radius: 22px;
    background: linear-gradient(135deg, #f4f4f5, #d4d4d8);
    color: #000;
    border: none;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s;
  }
  #chatInput button:active { transform: scale(0.95); }

  /* ============ ПАНЕЛЬ НАСТРОЕК ============ */
  .panel {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: flex-end;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .panel.show { opacity: 1; pointer-events: auto; }
  .panel-inner {
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
    border-top: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px 28px 0 0;
    padding: 20px 20px max(20px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .panel.show .panel-inner { transform: translateY(0); }

  .panel-handle {
    width: 40px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .panel-title {
    font-size: 20px; font-weight: 600;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #fff, #d4d4d8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .setting {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  .setting:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: #e4e4e7; }
  .setting-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; }
  .setting-control { flex-shrink: 0; }

  .switch {
    width: 48px; height: 28px;
    border-radius: 14px;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.1);
    position: relative;
    cursor: pointer;
    transition: all 0.25s;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .switch.on { background: linear-gradient(135deg, #f4f4f5, #d4d4d8); }
  .switch.on::after { transform: translateX(20px); background: #000; }

  .slider-wrap { display: flex; align-items: center; gap: 8px; }
  .slider-val {
    font-size: 12px; color: #d4d4d8;
    font-family: "SF Mono", ui-monospace, monospace;
    min-width: 34px; text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    width: 110px; height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f4f4f5, #d4d4d8);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    cursor: pointer;
  }

  select {
    padding: 8px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    max-width: 180px;
  }
  select option { background: #1a1a1a; }

  .close-panel {
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    border-radius: 16px;
    background: linear-gradient(135deg, #f4f4f5, #d4d4d8);
    border: none;
    color: #000;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .close-panel:active { transform: scale(0.98); }

  /* ============ СТАРТ ============ */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding: 40px 24px;
    transition: opacity 0.8s ease;
  }
  #startScreen.hide { opacity: 0; pointer-events: none; }

  #startName {
    font-size: 46px;
    font-weight: 200;
    letter-spacing: -1px;
    color: #fff;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
  }
  #startName span {
    display: inline-block;
    opacity: 0;
    transform: translateY(20px);
    animation: letterIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes letterIn { to { opacity: 1; transform: translateY(0); } }

  #startSub {
    font-size: 11px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(212,212,216,0.4);
    font-family: "SF Mono", ui-monospace, monospace;
    opacity: 0;
    animation: fadeIn 1s ease 1s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  #startBtn {
    padding: 16px 48px;
    border-radius: 40px;
    background: transparent;
    border: 1.5px solid rgba(212,212,216,0.4);
    color: #fff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    font-family: "SF Mono", ui-monospace, monospace;
    cursor: pointer;
    transition: all 0.3s;
    opacity: 0;
    animation: fadeIn 1s ease 1.5s forwards;
    -webkit-tap-highlight-color: transparent;
  }
  #startBtn:hover {
    background: linear-gradient(135deg, #f4f4f5, #d4d4d8);
    color: #000;
    border-color: transparent;
    box-shadow: 0 0 60px rgba(212,212,216,0.4);
  }
  #startBtn:active { transform: scale(0.95); }

  @media (max-width: 400px) {
    #dialog { font-size: 15px; }
    #talkBtn { width: 76px; height: 76px; }
    #talkBtn svg { width: 28px; height: 28px; }
    #startName { font-size: 36px; }
    .ctrlbtn { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="stars"></canvas>

<div id="app">
  <header>
    <div class="brand">WAVE · <span>AI</span></div>
    <div class="header-btns">
      <button class="hbtn" id="themeBtn" title="Тема">☾</button>
      <button class="hbtn" id="histBtn" title="История">⏱</button>
      <button class="hbtn" id="settingsBtn" title="Настройки">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="faceWrap">
    <div id="face">
      <svg viewBox="0 0 200 200">
        <!-- Голова с серебряным градиентом -->
        <defs>
          <radialGradient id="faceGrad" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#2a2a2e"/>
            <stop offset="100%" stop-color="#0a0a0c"/>
          </radialGradient>
          <linearGradient id="silverStroke" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f4f4f5"/>
            <stop offset="50%" stop-color="#a1a1aa"/>
            <stop offset="100%" stop-color="#d4d4d8"/>
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="78" fill="url(#faceGrad)" stroke="url(#silverStroke)" stroke-width="3"/>

        <!-- Левый глаз -->
        <g id="eyeL">
          <ellipse cx="74" cy="86" rx="10" ry="13" fill="#f4f4f5"/>
          <circle id="pupilL" cx="74" cy="86" r="5" fill="#0a0a0c"/>
          <circle cx="77" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>

        <!-- Правый глаз -->
        <g id="eyeR">
          <ellipse cx="126" cy="86" rx="10" ry="13" fill="#f4f4f5"/>
          <circle id="pupilR" cx="126" cy="86" r="5" fill="#0a0a0c"/>
          <circle cx="129" cy="83" r="1.8" fill="#fff" opacity="0.9"/>
        </g>

        <!-- Брови -->
        <path id="browL" d="M 62 68 Q 74 62 88 68" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>
        <path id="browR" d="M 112 68 Q 126 62 138 68" stroke="#d4d4d8" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0"/>

        <!-- Рот -->
        <path id="mouth" d="M 78 128 Q 100 138 122 128"
              stroke="#d4d4d8" stroke-width="4" fill="none"
              stroke-linecap="round"/>

        <!-- Ухо внутри круга -->
        <g id="ear" transform="translate(150, 100)">
          <path d="M 0 0 C -6 -14, 4 -24, 12 -18 C 19 -12, 19 -2, 12 4 C 6 9, 0 7, 0 0 Z"
                fill="#d4d4d8"/>
          <path d="M 4 0 C 1 -9, 6 -16, 10 -12 C 14 -8, 14 -2, 10 2 C 7 4, 4 3, 4 0 Z"
                fill="#0a0a0c" opacity="0.5"/>
        </g>
