if('serviceWorker' in navigator){var sw='self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});';var sb=new Blob([sw],{type:'text/javascript'});navigator.serviceWorker.register(URL.createObjectURL(sb)).catch(()=>{})}

function sweepAway(){var start=performance.now();function step(now){var p=Math.min((now-start)/900,1),ease=1-Math.pow(1-p,3),y=900-ease*1000,wave='M 0 '+y;for(var x=0;x<=400;x+=20){var off=Math.sin(x*.03+p*10)*35;wave+=' Q '+(x+10)+' '+(y+off)+' '+(x+20)+' '+y}wave+=' L 400 900 L 0 900 Z';sweepPath.setAttribute('d',wave);if(p<1)requestAnimationFrame(step);else{splash.classList.add('gone');setTimeout(function(){splash.remove()},800)}}requestAnimationFrame(step)}

var CHATS=[],curChatId=null,conversationHistory=[];
function loadChats(){try{CHATS=JSON.parse(localStorage.getItem('wave_chats')||'[]')}catch(e){CHATS=[]}}
function saveChats(){try{localStorage.setItem('wave_chats',JSON.stringify(CHATS))}catch(e){}}
function getCurChat(){return CHATS.find(function(c){return c.id===curChatId})}
function newChat(){var id='chat_'+Date.now();CHATS.unshift({id:id,title:'Новый чат',messages:[],created:Date.now()});saveChats();curChatId=id;conversationHistory=[];renderMessages();updateChatList()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function formatMd(t){if(!t)return'';var s=escapeHtml(t);s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');return s}
function addMsg(r,t,img){var c=getCurChat();if(!c){newChat();c=getCurChat()}c.messages.push({role:r,text:t,isImg:img||false,time:Date.now()});if(c.messages.length===1&&r==='user')c.title=t.substring(0,32);saveChats();renderMessages();updateChatList()}
function renderMessages(){var c=getCurChat();if(!c||c.messages.length===0){messagesEl.innerHTML='<div class="empty"><div class="logo">'+THEMES[curTheme].e+'</div><div class="title">Привет! Я Wave AI</div><div class="sub">Задай вопрос или переключись на рисовалку/игру</div></div>';return}messagesEl.innerHTML='';c.messages.forEach(function(m){var el=document.createElement('div');el.className='msg '+m.role+(m.isImg?' img':'');if(m.role==='wave'){el.innerHTML='<div class="waveHeader"><span class="waveMark">Wave</span></div>'+formatMd(m.text)}else{el.textContent=m.text}if(m.isImg){el.innerHTML='<img src="'+m.text+'">'}messagesEl.appendChild(el)});messagesEl.scrollTop=messagesEl.scrollHeight}
function showTyping(){var el=document.createElement('div');el.className='msg wave';el.id='typing';el.textContent='…';messagesEl.appendChild(el);messagesEl.scrollTop=messagesEl.scrollHeight}
function hideTyping(){var el=$('typing');if(el)el.remove()}
function switchChat(id){curChatId=id;conversationHistory=[];var c=getCurChat();if(c){c.messages.forEach(function(m){if(!m.isImg&&(m.role==='user'||m.role==='assistant')){conversationHistory.push({role:m.role,content:m.text})}});if(conversationHistory.length>10)conversationHistory=conversationHistory.slice(-10)}renderMessages();updateChatList();chatsPanel.classList.remove('show')}
function updateChatList(){chatList.innerHTML='';if(CHATS.length===0){chatList.innerHTML='<p style="opacity:.5;text-align:center;padding:20px">Нет чатов</p>';return}CHATS.forEach(function(c){var el=document.createElement('div');el.className='chatItem'+(c.id===curChatId?' active':'');el.innerHTML='<div class="info"><div class="chatTitle">'+escapeHtml(c.title)+'</div><div class="chatMeta">'+c.messages.length+' сообщ.</div></div><button class="del">×</button>';el.onclick=function(e){if(e.target.classList.contains('del'))return;haptic();switchChat(c.id)};el.querySelector('.del').onclick=function(e){e.stopPropagation();if(confirm('Удалить?')){CHATS=CHATS.filter(function(x){return x.id!==c.id});if(curChatId===c.id)curChatId=null;saveChats();if(!curChatId&&CHATS.length>0)curChatId=CHATS[0].id;else if(CHATS.length===0)newChat();renderMessages();updateChatList()}};chatList.appendChild(el)})}
loadChats();if(CHATS.length>0){curChatId=CHATS[0].id;renderMessages()}else{newChat()}

var audioCtx=null;
function initAudio(){try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}
function playClick(){initAudio();if(!audioCtx)return;var t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(990,t+.05);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.15)}
function stopSpeak(){if(currentAudio){try{currentAudio.pause()}catch(e){}currentAudio=null}try{speechSynthesis.cancel()}catch(e){}}
function speak(text){if(!voiceOutputEnabled)return;stopSpeak();if(useNeural){try{var url='https://text.pollinations.ai/'+encodeURIComponent(text)+'?model=openai-audio&voice='+VOICE;var a=new Audio(url);currentAudio=a;a.onerror=function(){useNeural=false;sysSpeak(text)};var p=a.play();if(p&&p.catch)p.catch(function(){useNeural=false;sysSpeak(text)});return}catch(e){useNeural=false}}sysSpeak(text)}
function sysSpeak(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel()}catch(e){}var u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=1.15;u.pitch=0.75;var vs=speechSynthesis.getVoices();var rv=vs.find(function(v){return v.lang==='ru-RU'});if(rv)u.voice=rv;speechSynthesis.speak(u)}

var BASE_SYS='Ты Wave AI — умный ИИ-ассистент. Отвечай коротко, живо, по-русски. Помогаешь со школьными задачами.';
function askAI(text){conversationHistory.push({role:'user',content:text});if(conversationHistory.length>10)conversationHistory=conversationHistory.slice(-10);var order=[currentModel];MODELS.forEach(function(m){if(m.id!==currentModel)order.push(m.id)});function tI(i){if(i>=order.length)return Promise.resolve('Не удалось ответить.');return fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:order[i],messages:[{role:'system',content:BASE_SYS}].concat(conversationHistory),temperature:0.8,max_tokens:400})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){var rep=(d.choices&&d.forEach(function(tchoices[0]&&d.choices[0].message&&d.choices[0].message.content)||d.response||'';rep=String(rep).trim();if(!rep)throw 0;conversationHistory.push({role:'assistant',content:rep});return rep}).catch(function(){return tI(i+1)})}return tI(0)}

function sendText(text){if(!text||!text.trim())return;text=text.trim();addMsg('user',text);showTyping();askAI(text).then(function(rep){hideTyping();addMsg('wave',rep)})}

var drawCanvas=$('drawCanvas'),drawResult=$('drawResult');
var dCtx=null,dDrawing=false,dLast=null,dColor='#000';
function initDraw(){
  dCtx=drawCanvas.getContext('2d');
  var r=drawCanvas.getBoundingClientRect();
  drawCanvas.width=r.width*2;drawCanvas.height=r.height*2;
  dCtx.setTransform(2,0,0,2,0,0);
  dCtx.fillStyle='#fff';dCtx.fillRect(0,0,r.width,r.height);
  dCtx.strokeStyle=dColor;dCtx.lineWidth=4;dCtx.lineCap='round';dCtx.lineJoin='round';
}
function dPos(e){var r=drawCanvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function dStart(e){e.preventDefault();dDrawing=true;dLast=dPos(e)}
function dMove(e){if(!dDrawing)return;e.preventDefault();var p=dPos(e);dCtx.beginPath();dCtx.moveTo(dLast.x,dLast.y);dCtx.lineTo(p.x,p.y);dCtx.stroke();dLast=p}
function dEnd(){dDrawing=false}
drawCanvas.addEventListener('mousedown',dStart);drawCanvas.addEventListener('mousemove',dMove);drawCanvas.addEventListener('mouseup',dEnd);drawCanvas.addEventListener('mouseleave',dEnd);
drawCanvas.addEventListener('touchstart',dStart,{passive:false});drawCanvas.addEventListener('touchmove',dMove,{passive:false});drawCanvas.addEventListener('touchend',dEnd);
document.querySelectorAll('.drawColor').forEach(function(c){c.onclick=function(){haptic();document.querySelectorAll('.drawColor').forEach(function(x){x.classList.remove('active')});c.classList.add('active');dColor=c.dataset.color;if(dCtx)dCtx.strokeStyle=dColor}});
$('drawClear').onclick=function(){haptic();playClick();if(!dCtx)return;var r=drawCanvas.getBoundingClientRect();dCtx.fillStyle='#fff';dCtx.fillRect(0,0,r.width,r.height);dCtx.strokeStyle=dColor;drawResult.classList.remove('show')};
$('drawSay').onclick=function(){haptic();playClick();drawResult.innerHTML='🎨 Красиво!';drawResult.classList.add('show');setTimeout(function(){drawResult.classList.remove('show')},2500)};

var gameCanvas=$('gameCanvas'),gameWord=$('gameWord'),gameScore=$('gameScore');
var gCtx=null,gDrawing=false,gLast=null,gScore=0,gWord='';
var GAME_WORDS=['кошка','собака','солнце','дом','дерево','машина','рыба','цветок','луна','звезда','облако','гора','птица','человек','сердце'];
function pickWord(){return GAME_WORDS[Math.floor(Math.random()*GAME_WORDS.length)]}
function initGame(){
  gCtx=gameCanvas.getContext('2d');
  var r=gameCanvas.getBoundingClientRect();
  gameCanvas.width=r.width*2;gameCanvas.height=r.height*2;
  gCtx.setTransform(2,0,0,2,0,0);
  gCtx.fillStyle='#fff';gCtx.fillRect(0,0,r.width,r.height);
  gCtx.strokeStyle='#000';gCtx.lineWidth=4;gCtx.lineCap='round';gCtx.lineJoin='round';
  if(!gWord){gWord=pickWord();gameWord.textContent=gWord}
}
function gPos(e){var r=gameCanvas.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function gStart(e){e.preventDefault();gDrawing=true;gLast=gPos(e)}
function gMove(e){if(!gDrawing)return;e.preventDefault();var p=gPos(e);gCtx.beginPath();gCtx.moveTo(gLast.x,gLast.y);gCtx.lineTo(p.x,p.y);gCtx.stroke();gLast=p}
function gEnd(){gDrawing=false}
gameCanvas.addEventListener('mousedown',gStart);gameCanvas.addEventListener('mousemove',gMove);gameCanvas.addEventListener('mouseup',gEnd);gameCanvas.addEventListener('mouseleave',gEnd);
gameCanvas.addEventListener('touchstart',gStart,{passive:false});gameCanvas.addEventListener('touchmove',gMove,{passive:false});gameCanvas.addEventListener('touchend',gEnd);
$('gameNew').onclick=function(){haptic();playClick();gWord=pickWord();gameWord.textContent=gWord;var r=gameCanvas.getBoundingClientRect();gCtx.fillStyle='#fff';gCtx.fillRect(0,0,r.width,r.height);gCtx.strokeStyle='#000'};
$('gameCheck').onclick=function(){haptic();playClick();gScore+=100;gameScore.textContent='Очков: '+gScore;gameWord.textContent='✅ +100!';setTimeout(function(){gWord=pickWord();gameWord.textContent=gWord;var r=gameCanvas.getBoundingClientRect();gCtx.fillStyle='#fff';gCtx.fillRect(0,0,r.width,r.height);gCtx.strokeStyle='#000'},800)};

if(window.SpeechRecognition||window.webkitSpeechRecognition){var SR=window.SpeechRecognition||window.webkitSpeechRecognition;voiceRec=new SR();voiceRec.lang='ru-RU';voiceRec.interimResults=true;voiceRec.continuous=false;
voiceRec.onstart=function(){voiceIsListening=true;voiceOverlay.classList.add('listening');voiceBtn.classList.add('listening');voiceSub.textContent='СЛУШАЮ';voiceTitle.textContent='…';voiceFinal=''};
voiceRec.onresult=function(e){var i2='',f2='';for(var i=e.resultIndex;i<e.results.length;i++){var t=e.results[i][0].transcript;if(e.results[i].isFinal)f2+=t;else i2+=t}if(f2)voiceFinal+=f2;voiceTitle.textContent=(voiceFinal+' '+i2).trim()};
voiceRec.onerror=function(){voiceIsListening=false;voiceOverlay.classList.remove('listening');voiceBtn.classList.remove('listening');voiceSub.textContent='ОШИБКА'};
voiceRec.onend=function(){voiceIsListening=false;voiceOverlay.classList.remove('listening');voiceBtn.classList.remove('listening');var t=voiceFinal.trim();if(t){voiceOverlay.classList.remove('show');voiceOutputEnabled=false;addMsg('user',t);showTyping();askAI(t).then(function(rep){hideTyping();addMsg('wave',rep);speak(rep)})}else{voiceSub.textContent='НЕ РАССЛЫШАЛ'}}}
voiceOpenBtn.onclick=function(){haptic();initAudio();playClick();stopSpeak();voiceOutputEnabled=true;voiceOverlay.classList.add('show');voiceTitle.textContent='Нажми и говори';voiceSub.textContent='ГОТОВ'};
voiceExitBtn.onclick=function(){haptic();initAudio();playClick();voiceOutputEnabled=false;if(voiceIsListening&&voiceRec)voiceRec.stop();stopSpeak();voiceOverlay.classList.remove('show')};
voiceBtn.onclick=function(){haptic();initAudio();playClick();if(!voiceRec){voiceTitle.textContent='Микрофон не поддерживается';return}if(voiceIsListening){voiceRec.stop();return}stopSpeak();try{voiceRec.start()}catch(e){}};
